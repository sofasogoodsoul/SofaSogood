<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SofaSogood ✦ 答案遊戲紀錄</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&display=swap');

:root {
  /* 核心色 */
  --bg: #F7F3EC;
  --surface: #FDFCF9;
  --card: #FAF8F4;
  --border: rgba(124,98,72,0.10);
  --border-strong: rgba(124,98,72,0.22);

  /* 文字 */
  --text: #2C2218;
  --text-muted: #7A6A58;
  --text-dim: #B8A898;

  /* 主品牌色：卡其棕 */
  --gold: #8C6E4E;
  --gold-dim: rgba(140,110,78,0.08);
  --gold-border: rgba(140,110,78,0.28);
  --gold-light: #B8956A;

  /* 三關色：降飽和、偏暖 */
  --body-c: #A03020;   --body-bg: #FAF0EE;
  --mind-c: #2050A0;   --mind-bg: #EEF2FA;
  --spirit-c: #6040A8; --spirit-bg: #F3EEFA;

  /* 牌卡標籤 */
  --tarot-bg: #FBF4EA; --tarot-c: #8C5E28;
  --issue-bg: #EEF1FB; --issue-c: #3A5896;
  --guide-bg: #F3EEFA; --guide-c: #6040A0;
  --noble-bg: #FAF5E4; --noble-c: #7A6018;
  --release-bg: #F0EEF8; --release-c: #5050A0;
  --destiny-bg: #EDF7EE; --destiny-c: #3A7040;
  --golden-bg: #FBF7E4; --golden-c: #806820;

  /* 狀態 */
  --pass-bg: #EEF6F1; --pass-c: #3A6E50;
  --warn-bg: #FBF5E6; --warn-c: #8C5A18;
  --err-bg: #FBF0EE; --err-c: #A03030;

  --radius: 6px;
  --tab-h: 62px; --hand-h: 66px;
  --header-h: 54px;
  --header-status-h: 36px;
  --font: 'Noto Serif TC','Georgia',serif;
  --sans: 'Noto Serif TC',-apple-system,'Helvetica Neue',sans-serif;
}

html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;letter-spacing:0.01em;}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;background:linear-gradient(180deg,#FDFCF9 70%,rgba(253,252,249,0.95));border-bottom:1px solid var(--border);z-index:100;backdrop-filter:blur(8px);}
.header-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;}
.header-status{padding:0 14px 8px;}
.header-status:empty{display:none;}
.status-bar{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;width:100%;}
.status-bar+.status-bar{margin-top:4px;}
.status-bar.pass{background:var(--pass-bg);color:var(--pass-c);}
.status-bar.warn{background:var(--warn-bg);color:var(--warn-c);}
.status-bar.limit{background:var(--err-bg);color:var(--err-c);}
.title{font-family:var(--font);font-size:15px;color:var(--gold);letter-spacing:.06em;font-weight:400;flex-shrink:0;}
.player-tabs{display:flex;gap:5px;flex:1;justify-content:center;}
.ptab{padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:none;font-size:13px;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
.ptab.active{background:var(--gold);color:#fff;border-color:var(--gold);}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;}

/* SCROLL */
.scroll-area{position:fixed;top:calc(var(--header-h) + var(--header-status-h));left:0;right:0;bottom:calc(var(--tab-h) + var(--hand-h));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 80px;display:flex;flex-direction:column;gap:12px;}

/* PHASE STRIP */
.phase-strip{display:flex;gap:6px;}
.phase-chip{flex:1;padding:10px 6px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .2s;}
.phase-chip.body,.phase-chip.mind,.phase-chip.spirit{background:var(--surface);border-color:var(--border);color:var(--text-dim);}
.phase-chip.body.done,.phase-chip.body.active{background:linear-gradient(135deg,#FAF0EE,#F5E6E2);border-color:rgba(160,48,32,0.2);color:var(--body-c);}
.phase-chip.mind.done,.phase-chip.mind.active{background:linear-gradient(135deg,#EEF2FA,#E4EDFA);border-color:rgba(32,80,160,0.2);color:var(--mind-c);}
.phase-chip.spirit.done,.phase-chip.spirit.active{background:linear-gradient(135deg,#F3EEFA,#EAE0F8);border-color:rgba(96,64,168,0.2);color:var(--spirit-c);}
.phase-chip.blueprint{background:linear-gradient(135deg,#FAF5E4,#F0E8D0);border-color:rgba(140,110,78,0.25);color:var(--gold);}
.phase-chip.active.body{background:linear-gradient(135deg,#F5E0DA,#EDD0C8);border-color:var(--body-c);font-weight:600;}
.phase-chip.active.mind{background:linear-gradient(135deg,#DDE8F8,#CCDAF5);border-color:var(--mind-c);font-weight:600;}
.phase-chip.active.spirit{background:linear-gradient(135deg,#E8DDF8,#DDD0F5);border-color:var(--spirit-c);font-weight:600;}
.phase-chip.active.blueprint{background:linear-gradient(135deg,#F0E4C0,#E8D8A8);border-color:var(--gold);font-weight:600;}
.phase-chip.done::after{content:'✓';display:block;font-size:11px;opacity:.7;}
.pc-name{font-size:13px;font-weight:500;letter-spacing:.02em;}
.pc-count{font-size:11px;opacity:.65;margin-top:2px;}

/* PASS STATUS */
.pass-banner{border-radius:var(--radius);padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;}
.pass-banner.pass{background:var(--pass-bg);color:var(--pass-c);}
.pass-banner.warn{background:var(--warn-bg);color:var(--warn-c);}
.pass-banner.limit{background:var(--err-bg);color:var(--err-c);}
.pass-icon{font-size:16px;flex-shrink:0;}
.pass-text{flex:1;line-height:1.4;}
.pass-detail{font-size:12px;opacity:.8;margin-top:2px;}

/* NOBLE CARRY */
.carry-box{background:linear-gradient(135deg,#FBECEA,#F6DEDA);border:1.5px solid #C0503C;border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:#A03020;}
.carry-title{font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.carry-state{font-size:12px;font-weight:400;opacity:.85;}
.carry-type{padding:6px 14px;border-radius:20px;border:1.5px solid rgba(160,48,32,.3);background:transparent;color:#A03020;font-size:12px;cursor:pointer;}
.carry-type.active{background:#C0503C;border-color:#C0503C;color:#fff;}
.carry-box .orient-btn{border:1.5px solid rgba(160,48,32,.3);color:#A03020;background:transparent;}
.carry-box .orient-btn.active{background:#C0503C;border-color:#C0503C;color:#fff;font-weight:500;}
.carry-collapsed{cursor:pointer;padding:10px 14px;}
.carry-arrow{margin-left:auto;font-size:16px;opacity:.7;}
.carry-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.carry-save{padding:7px 22px;border-radius:14px;border:none;background:#C0503C;color:#fff;font-size:13px;cursor:pointer;}
.carry-save:disabled{opacity:.4;cursor:default;}
.carry-cancel{padding:5px 12px;border-radius:14px;border:1px solid rgba(160,48,32,.3);background:transparent;color:#A03020;font-size:12px;cursor:pointer;}
.noble-carry{background:var(--noble-bg);border:1px solid rgba(128,96,16,.2);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--noble-c);display:flex;align-items:center;gap:6px;}

/* ROUND LOG */
/* 主內容區塊之間的間距：關卡列、帶入貴人卡、輪次列表 */
#mainContent{display:flex;flex-direction:column;gap:14px;}
.round-log{display:flex;flex-direction:column;gap:10px;}
.roll-entry{background:linear-gradient(160deg,#FDFCF9 0%,#FAF7F0 100%);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 6px rgba(124,98,72,0.07);}
.roll-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.roll-meta{display:flex;align-items:center;gap:8px;}
.roll-num{font-size:12px;color:var(--text-muted);font-weight:500;}
.move-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:50%;background:transparent;color:var(--text-muted);font-size:13px;line-height:1;cursor:pointer;padding:0;}
.move-btn:disabled{opacity:.3;cursor:default;}
.roll-dice{font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--text);}
.cell-badge{font-size:12px;padding:3px 10px;border-radius:20px;}
.cell-badge.tarot{background:var(--tarot-bg);color:var(--tarot-c);}
.cell-badge.issue{background:var(--issue-bg);color:var(--issue-c);}
.cell-badge.guide{background:var(--guide-bg);color:var(--guide-c);}
.cell-badge.noble{background:var(--noble-bg);color:var(--noble-c);}
.cell-badge.release{background:var(--release-bg);color:var(--release-c);}
.cell-badge.destiny{background:var(--destiny-bg);color:var(--destiny-c);}
.cell-badge.golden{background:var(--golden-bg);color:var(--golden-c);}
.cell-badge.first{background:#F0EDE6;color:var(--text-dim);}
.ct-btn.active.first{background:#F0EDE6;color:var(--text-muted);border-color:var(--text-dim);}
.ct-btn.active.golden{background:var(--golden-bg);color:var(--golden-c);border-color:var(--golden-c);}
.rule-note.golden{background:var(--golden-bg);border-color:var(--golden-c);}
.del-btn{width:28px;height:28px;border-radius:50%;border:none;background:none;color:var(--text-dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.del-btn:active{background:var(--err-bg);color:var(--err-c);}
.roll-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}

/* PHOTO AREA */
.card-img-wrap{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#FAF7F0,#F5EFE4);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-top:2px;}
.card-img-thumb{width:56px;height:88px;object-fit:cover;border-radius:4px;flex-shrink:0;box-shadow:0 2px 6px rgba(124,98,72,0.15);}
.card-img-info{display:flex;flex-direction:column;gap:4px;justify-content:center;flex:1;}
.card-img-name{font-size:15px;color:var(--text);font-family:var(--font);font-weight:400;letter-spacing:.04em;}
.card-img-orient{font-size:11px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;}
.card-img-type{font-size:11px;color:var(--text-dim);margin-top:2px;}
.ai-scanning{position:absolute;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text-muted);}
.spinner{width:24px;height:24px;border:3px solid var(--border-strong);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-result{background:#f0faf5;border:1px solid rgba(26,122,80,.25);border-radius:var(--radius);padding:8px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.ai-result-text{font-size:12px;color:#1a7a50;line-height:1.5;flex:1;}
.ai-dismiss{background:none;border:none;color:#1a7a50;font-size:16px;cursor:pointer;opacity:.6;padding:0 2px;}

/* FIELDS */
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:11px;color:var(--text-muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase;}
.ct-btns{display:flex;flex-wrap:wrap;gap:6px;}
.ct-btn{font-size:12px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap;letter-spacing:.01em;}
.ct-btn.active.tarot{background:var(--tarot-bg);color:var(--tarot-c);border-color:var(--tarot-c);}
.ct-btn.active.issue{background:var(--issue-bg);color:var(--issue-c);border-color:var(--issue-c);}
.ct-btn.active.guide{background:var(--guide-bg);color:var(--guide-c);border-color:var(--guide-c);}
.ct-btn.active.noble{background:var(--noble-bg);color:var(--noble-c);border-color:var(--noble-c);}
.ct-btn.active.release{background:var(--release-bg);color:var(--release-c);border-color:var(--release-c);}
.ct-btn.active.destiny{background:var(--destiny-bg);color:var(--destiny-c);border-color:var(--destiny-c);}
select,input[type="text"],textarea{width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:15px;padding:10px 12px;outline:none;-webkit-appearance:none;color-scheme:light;}
select:focus,input:focus,textarea:focus{border-color:var(--gold);}
input::placeholder,textarea::placeholder{color:var(--text-dim);}
textarea{resize:none;line-height:1.5;min-height:60px;}
.orient-btns{display:flex;gap:8px;}
.orient-btn{flex:1;padding:9px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;text-align:center;letter-spacing:.02em;}
.orient-btn.active{background:linear-gradient(135deg,#FBF4EA,#F5EAD8);color:var(--tarot-c);border-color:var(--tarot-c);font-weight:500;}

/* ADD ROLL BTN */
.add-roll-btn{width:100%;padding:13px;border-radius:var(--radius);border:1px dashed var(--gold-border);background:var(--gold-dim);color:var(--gold);font-size:14px;cursor:pointer;text-align:center;}
.add-roll-btn:active{opacity:.8;}

/* FAB */
.fab-unused{display:none;}

/* TAB BAR */
.hand-bar{position:fixed;bottom:var(--tab-h);left:0;right:0;height:var(--hand-h);background:linear-gradient(180deg,#F7F2EA,#FDFCF9);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 74px 0 12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;z-index:99;scrollbar-width:none;}
.hand-bar::-webkit-scrollbar{display:none;}
.hand-bar-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);flex-shrink:0;margin-right:2px;}
.hand-card-mini{flex-shrink:0;width:32px;height:50px;border-radius:3px;box-shadow:0 2px 5px rgba(124,98,72,0.2);overflow:hidden;position:relative;cursor:pointer;transition:transform .15s;}
.hand-card-mini:hover{transform:translateY(-3px);}
.hand-card-mini img{width:100%;height:100%;object-fit:cover;}
.hand-card-mini.no-img{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:rgba(255,255,255,0.9);}
.hand-card-mini.tarot-c{background:linear-gradient(160deg,#e8d4b0,#c09050);}
.hand-card-mini.issue-c{background:linear-gradient(160deg,#b8cce8,#7098c8);}
.hand-card-mini.guide-c{background:linear-gradient(160deg,#c8b8e0,#9870c8);}
.hand-card-mini.noble-c{background:linear-gradient(160deg,#e8dea0,#c0a830);}
.hand-card-mini.destiny-c{background:linear-gradient(160deg,#a8d8b0,#50a868);}
.hand-card-mini.golden-c{background:linear-gradient(160deg,#f0dea0,#c8a030);}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:linear-gradient(0deg,#FDFCF9 60%,rgba(247,243,236,0.96));border-top:1px solid var(--border);display:flex;z-index:100;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;padding:6px 0;position:relative;transition:background .15s;}
.tab.player-active{border-radius:0;}
.tab-icon{font-size:17px;color:var(--text-dim);}
.tab-label{font-size:10px;color:var(--text-dim);}
.tab.active .tab-icon,.tab.active .tab-label{color:var(--gold);}
.tab-dot{display:none!important;}
.tab-dot.show{display:none!important;}

/* DRAWER */
.admin-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:14px;color:var(--text-muted);text-align:left;}
.admin-code{font-weight:700;letter-spacing:.12em;color:var(--text);font-size:16px;}
.admin-arrow{margin-left:auto;font-size:18px;opacity:.6;}
.admin-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.rules-panel{width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#FAF8F2 0%,#FDFCF9 40%);border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);}
.rules-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;font-size:16px;font-weight:600;color:var(--text);}
.rules-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:18px;cursor:pointer;line-height:1;}
.rules-body{overflow:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch;}
.rules-title{font-size:12px;letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;}
.rule-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.5;}
.rule-row:last-child{border-bottom:none;}
.rule-name{flex-shrink:0;width:64px;font-weight:600;color:var(--text-muted);}
.rules-note{font-size:13px;color:var(--text-muted);line-height:1.7;margin-top:4px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#FAF8F2 0%,#FDFCF9 40%);border-radius:14px 14px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;display:flex;flex-direction:column;}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:14px auto 0;flex-shrink:0;}
.drawer-title{font-size:16px;font-weight:600;padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.drawer-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1;}

/* DRAWER INTERNALS */
.info-section{display:flex;flex-direction:column;gap:14px;}
.info-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:4px;}
.summary-grid{display:flex;flex-direction:column;gap:8px;}
.scard{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
.scard-hd{padding:9px 14px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;}
.scard-hd.body{background:linear-gradient(90deg,#FAF0EE,#F5E4E0);color:var(--body-c);}
.scard-hd.mind{background:linear-gradient(90deg,#EEF2F9,#E6EEF8);color:var(--mind-c);}
.scard-hd.spirit{background:linear-gradient(90deg,#F4EFF9,#EDE6F6);color:var(--spirit-c);}
.scard-bd{padding:8px 14px;display:flex;flex-direction:column;gap:4px;}
.scard-row{font-size:12px;color:var(--text-muted);display:flex;gap:6px;}
.scard-idx{color:var(--text-dim);flex-shrink:0;}
.blueprint-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--gold-border);}
.bp-cell{background:var(--card);padding:9px;display:flex;flex-direction:column;gap:2px;}
.bp-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.bp-val{font-size:12px;color:var(--text-muted);font-style:italic;min-height:24px;}
.export-btns{display:flex;flex-direction:column;gap:8px;}
.export-btn{width:100%;padding:13px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;text-align:center;}
.export-btn.primary{background:linear-gradient(135deg,#A07850 0%,#7C5C38 100%);border-color:transparent;color:#fff;font-weight:400;letter-spacing:.06em;}
.export-btn:active{opacity:.8;}

/* SETUP SCREEN */
.setup-screen{display:flex;flex-direction:column;gap:16px;}
.setup-title{font-size:16px;font-weight:400;color:var(--text);font-family:var(--font);letter-spacing:.04em;}
.setup-subtitle{font-size:13px;color:var(--text-muted);margin-top:-8px;}
.player-setup-card{background:linear-gradient(150deg,#FDFCF9 0%,#F9F5EE 100%);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;}
.player-setup-hd{display:flex;align-items:center;justify-content:space-between;}

<script>
// ── CONSTANTS ──
const PHASES = ['body','mind','spirit'];

const PLAYER_COLORS = ['#6040A8','#2050A0','#3A7840','#A03020'];
const ZODIAC_GROUPS = {
  fire:  ['白羊','獅子','射手'],
  earth: ['金牛','處女','摩羯'],
  air:   ['雙子','天秤','水瓶'],
  water: ['巨蟹','天蠍','雙魚'],
};
const ZODIAC_LABEL = {fire:'火象',earth:'土象',air:'風象',water:'水象'};
const ZODIAC_COLOR = {fire:'#A03020',earth:'#3A7840',air:'#6040A8',water:'#2050A0'};

const CELL_TYPES = [
  {key:'tarot',        label:'探索',   cls:'tarot'},
  {key:'tarot-minor',  label:'真相',   cls:'tarot'},
  {key:'guide',        label:'指引',   cls:'guide'},
  {key:'issue',        label:'議題',   cls:'issue'},
  {key:'destiny',      label:'命運之輪',cls:'destiny'},
  {key:'noble',        label:'貴人',   cls:'noble'},
  {key:'release',      label:'放下',   cls:'release'},
  {key:'golden',       label:'黃金格', cls:'golden'},
  {key:'first',        label:'第一格', cls:'first'},
];
const CELL_CLASS = {tarot:'tarot','tarot-minor':'tarot',issue:'issue',guide:'guide',noble:'noble',release:'release',destiny:'destiny',golden:'golden',first:'first'};
const INFO_CELLS = ['tarot','tarot-minor','issue','guide','golden']; // 訊息卡類型

// ── 附加貴人：玩家是「受助方」，得到的是對方給的牌，不是貴人卡 ──
function isExtraNoble(r) { return !!(r && r.isExtra && r.cellType === 'noble'); }
// 附加貴人實際得到的牌種（命運之輪再往下看抽到的牌種）
function nobleGiftType(r) {
  if (!isExtraNoble(r)) return null;
  return r.nobleCardType === 'destiny' ? (r.destinyCardType || null) : (r.nobleCardType || null);
}
// 這一輪對手牌貢獻的訊息牌種；不是訊息牌回傳 null
function infoTypeOf(r) {
  if (r.fromCarry) return (INFO_CELLS.includes(r.cellType) && r.cardName) ? r.cellType : null;
  if (isExtraNoble(r)) { const t = nobleGiftType(r); return (INFO_CELLS.includes(t) && r.cardName) ? t : null; }
  // 附加命運之輪：自己得到牌，看抽到的牌種
  if (r.isExtra && r.cellType === 'destiny') { const t = r.destinyCardType; return (INFO_CELLS.includes(t) && r.cardName) ? t : null; }
  if (r.cellType === 'golden') return r.goldenCardType || 'golden'; // 黃金格看實際抽到的牌種
  return INFO_CELLS.includes(r.cellType) ? r.cellType : null;
}
// 過關保底分組：探索/真相同一組，議題一組，指引一組
function cardGroupOf(r) {
  const t = infoTypeOf(r);
  if (t === 'tarot' || t === 'tarot-minor') return 'tarot';
  if (t === 'issue' || t === 'guide') return t;
  return null;
}
const GROUP_LABEL = {tarot:'探索/真相', issue:'議題', guide:'指引'};
function isInfoRoll(r) { return infoTypeOf(r) !== null; }
// 真正的貴人卡：只有自己踩到貴人格子才算
function isNobleCard(r) { return r.cellType === 'noble' && !r.isExtra; }
// 得到放下卡：放下格子，或附加貴人給的是放下卡
// 附加「放下」＝執行放下（選一張手牌放掉），本身不會多一張放下卡
function givesReleaseCard(r) { return (r.cellType === 'release' && !r.isExtra) || (isExtraNoble(r) && r.nobleCardType === 'release'); }
function isReleaseAction(r) { return !!(r.isExtra && r.cellType === 'release'); }
// 已被放下的牌名（可排除某一輪自己的選擇）
function releasedNames(rolls, exceptId) {
  const out = [];
  rolls.forEach(r => {
    if (isReleaseAction(r) && r.releasedCard && r.id !== exceptId) out.push(r.releasedCard);
    (r.extras||[]).forEach(e => { if (e.type === 'release' && e.releasedCard) out.push(e.releasedCard); });
  });
  return out;
}
// 目前還在手上的訊息牌（扣掉已放下的）
function activeInfoRolls(rolls, exceptId) {
  const gone = releasedNames(rolls, exceptId);
  return rolls.filter(r => isInfoRoll(r) && !(r.cardName && gone.includes(r.cardName)));
}
// 上一關帶來、已經拿去換成訊息牌的貴人卡張數
function usedCarryCount(player, phase) {
  const carry = player.nobleCarry[phase] || 0;
  const used = player.phases[phase].filter(r => r.fromCarry && r.cardName && r.carryIndex < carry).length;
  return Math.min(carry, used);
}

// 貴人／放下卡的牌面：漸層底色＋文字（used = 已執行的放下，變灰）
const TOKEN_BG = {
  noble:   'linear-gradient(160deg,#FFFFFF 0%,#F4F0E9 55%,#DDD5C8 100%)',
  release: 'linear-gradient(160deg,#5A4A3C 0%,#2C2218 55%,#0E0B08 100%)',
  used:    'linear-gradient(160deg,#C4BEB6 0%,#A39D95 55%,#86807A 100%)',
};
function tokenStyle(kind, used) {
  const bg = kind === 'noble' ? TOKEN_BG.noble : used ? TOKEN_BG.used : TOKEN_BG.release;
  const color = kind === 'noble' ? '#3C2E22' : '#fff';
  const border = kind === 'noble' ? 'border:1.5px solid #D8CFC2;' : 'border:1.5px solid rgba(0,0,0,.25);';
  return `background:${bg};color:${color};${border}display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.15em;writing-mode:vertical-rl;text-orientation:upright;`;
}

// 手牌依操作步驟排序：每一輪拿到什麼就放在那個位置
function handItemsInOrder(rolls) {
  const handIds = new Set(activeInfoRolls(rolls).map(r => r.id));
  const { done } = releaseCounts(rolls);
  let relIdx = 0;
  const items = [];
  rolls.forEach(r => {
    if (isInfoRoll(r) && r.cardName) items.push({ kind:'info', roll:r, gone: !handIds.has(r.id) });
    if (isNobleCard(r)) items.push({ kind:'noble', roll:r });
    if (givesReleaseCard(r)) { items.push({ kind:'release', roll:r, used: relIdx < done }); relIdx++; }
  });
  return items;
}

// 放下卡張數 / 已執行 / 未執行
function releaseCounts(rolls) {
  let cards = 0, done = 0;
  rolls.forEach(r => {
    if (givesReleaseCard(r)) cards++;
    if (isReleaseAction(r) && r.releasedCard) done++;
    (r.extras||[]).forEach(e => { if (e.type === 'release') { cards++; if (e.releasedCard) done++; } });
  });
  return { cards, done, pending: Math.max(0, cards - done) };
}

function getCardImg(name, orientation, type) {
  if (type === 'issue' && CARD_IMAGES['議題:'+name]) return CARD_IMAGES['議題:'+name];

// ── PASS LOGIC ──
function calcPassStatus(player, phase) {
  const rolls = player.phases[phase];

  // 放下卡：放下格子、附加貴人給的放下；執行：附加「放下」選了牌
  const { cards: releaseCards, pending: pendingRelease } = releaseCounts(rolls);

  const infoCards = activeInfoRolls(rolls);
  const nobles = rolls.filter(isNobleCard).length;
  // 帶入的貴人卡一定要換成訊息卡，不算這關的貴人卡；還沒換的算待處理
  const pendingCarry = Math.max(0, (player.nobleCarry[phase] || 0) - usedCarryCount(player, phase));
  const totalNobles = nobles;

  const hasTarot = infoCards.some(r => cardGroupOf(r) === 'tarot');
  const hasIssue = infoCards.some(r => cardGroupOf(r) === 'issue');
  const hasGuide = infoCards.some(r => cardGroupOf(r) === 'guide');
  const has3Types = hasTarot && hasIssue && hasGuide;
  const infoCount = infoCards.length;
  const hasNoble  = totalNobles >= 1;
  const atLimit   = infoCount >= 9;

  // 方式①：手上（扣掉已放下的）至少 4 張訊息卡，三種都要有（塔羅、議題、指引），再加 1 張貴人卡；
  //        有未執行的放下卡時不能過關（見下方 blocked）
  const passA = infoCount >= 4 && has3Types && hasNoble;
  // 方式B：任意 7 張訊息卡，不需要貴人卡
  const passB = infoCount >= 7;
  // 有未執行的放下卡 → 先不能過關，但其餘條件照樣計算
  const blocked = pendingRelease > 0 || pendingCarry > 0;
  const canPass = (passA || passB) && !blocked;

  const missing = [];
  if (!hasTarot) missing.push('塔羅牌');
  if (!hasIssue) missing.push('議題卡');
  if (!hasGuide) missing.push('指引卡');
  if (!hasNoble) missing.push('貴人卡×1');

  // 智慧提示：分析放下後能否過關
  // 放下規則：塔羅、議題、指引各需保留至少 1 張
  let releaseHint = null;
  if (!canPass && releaseCards === 0 && has3Types && hasNoble) {
    const tarotCount = infoCards.filter(r => cardGroupOf(r)==='tarot').length;
    const issueCount = infoCards.filter(r => cardGroupOf(r)==='issue').length;
    const guideCount = infoCards.filter(r => cardGroupOf(r)==='guide').length;
    const maxDrop = Math.max(0, tarotCount-1) + Math.max(0, issueCount-1) + Math.max(0, guideCount-1);
    if (maxDrop > 0 && (infoCount - maxDrop) >= 7 && hasNoble) {
      releaseHint = `最多可放下 ${maxDrop} 張後達方式②過關`;
    }
  }

  return { canPass, passA, passB, blocked, pendingRelease, pendingCarry,
    infoCount, has3Types, hasNoble, missing, atLimit, totalNobles, releaseHint };
}

function calcNobleCarryForward(player, phase) {
  const rolls = player.phases[phase];
  const nobles = rolls.filter(isNobleCard).length;
  // 這關踩到的貴人卡留 1 張過關，其餘帶到下一關換牌（帶入的貴人卡已經換掉，不會再往下帶）
  return Math.max(0, nobles - 1);
}

function initPlayers(n) {
  const old = players;
  players = Array.from({length: n}, (_,i) => {
    const existing = old.find(p => p.id === i);
    return existing || {
      id: i, name:'', zodiac:'', topic:'', color: null,
      phases: {body:[], mind:[], spirit:[]},
      nobleCarry: {body:0, mind:0, spirit:0},
      phaseDone: {body:false, mind:false, spirit:false},
      insight:'', action:''
    };
  });
  renderSetup();
}

function setSetupColor(id, color) {
  const p = players.find(x => x.id === id);
  if (p) p.color = color;
  renderSetup();
}

function updatePlayerSetup(id, field, val) {
  const p = players.find(x => x.id === id);
  if (p) p[field] = val;
}

    noblePerson:'', nobleDice:'', nobleRole:'',

    + '<button onclick="document.getElementById(&quot;extraMenu&quot;).remove()" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;">取消</button>'
    + '</div>';
  m.onclick = () => m.remove();
  document.body.appendChild(m);
}

function addRollWithType(cellType) {
  const player = getPlayer(); if (!player) return;
  player.phases[currentPhase].forEach(r => { r.collapsed = true; });
  player.phases[currentPhase].push({
    id: nextId++, cellType, cardName:'', orientation:'', tarotGroup:'', guideGroup:'',
    note:'', extras:[], collapsed:false,
    noblePerson:'', nobleDice:'', nobleRole:'',
    releasedCard:'', releaseType:'', destinyWinner:'', destinyCardType:''
  });
  renderPhaseContent();
  setTimeout(() => {
    const a = document.getElementById('scrollArea');
    if (a) a.scrollTop = a.scrollHeight;
  }, 60);
}

function hideFab() {
  const f = document.getElementById('mainFab');
  if (f) f.remove();
}

function startGame() {
  if (!players.length) return;
  gameStarted = true;
  currentPlayerId = players[0].id;
  currentPhase = 'body';
  renderPlayerTabs();
  renderPhaseContent();
  showFab();
  saveCurrentSession();
  archiveCurrentSession();
}

// ── PLAYER TABS ──
function updateDots() {
  renderPlayerTabs();
}

function renderPlayerTabs() {
  const bar = document.getElementById('playerTabsBar');
  if (!bar) return;
  const shown = (typeof ONLINE !== 'undefined' && ONLINE && ONLINE.mode === 'player') ? players.filter(p => p.id === ONLINE.pid) : players;
  bar.innerHTML = shown.map(p => {
    const hasRolls = PHASES.some(ph => p.phases[ph].length > 0);
    const isActive = p.id === currentPlayerId;
    const name = p.name || '玩家'+(p.id+1);
    const color = p.color || '#B8A898';
    const activeBg = isActive ? `${color}18` : 'transparent';
    const borderTop = isActive ? `3px solid ${color}` : '3px solid transparent';
    return `<button class="tab ${isActive?'active player-active':''}"
      onclick="switchPlayer(${p.id})"
      style="border-top:${borderTop};background:${activeBg};transition:all .15s;">
      <div style="display:flex;align-items:center;gap:4px;">
        <div onclick="event.stopPropagation();showColorPicker(${p.id})" style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;cursor:pointer;"></div>
        <span class="tab-label" style="font-weight:${isActive?'600':'400'};color:${isActive?color:'var(--text-muted)'};" ondblclick="event.stopPropagation();editPlayerName(${p.id})">${name}</span>
      </div>

}

function showColorPicker(id) {
  const COLORS = [
    {c:'#6040A8',n:'紫'},{c:'#2050A0',n:'藍'},{c:'#A03020',n:'紅'},{c:'#3A7840',n:'綠'},

    <div style="font-family:var(--font);font-size:14px;color:var(--text-muted);">選擇顏色</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">

          <div style="width:28px;height:28px;border-radius:50%;background:${c};"></div>

        </button>`;
      }).join('')}
    </div>
    <button onclick="document.getElementById('colorPickerModal').remove()" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;">取消</button>

function setPlayerColor(id, color) {
  const p = players.find(x => x.id === id);
  if (p) p.color = color;
  document.getElementById('colorPickerModal')?.remove();
  renderPlayerTabs();
  autoSave();
}

function editPlayerName(id) {

  m.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(44,34,24,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;';

function savePlayerName(id) {
  const input = document.getElementById('editNameInput');

// 已達標但還沒標記過關的關卡（舊存檔、或沒按儲存就切走）→ 補標記為已過
function syncPhaseProgress(player) {
  if (!player) return;
  const order = ['body','mind','spirit'];
  for (let k = 0; k < order.length; k++) {
    const ph = order[k];
    if (player.phaseDone[ph]) continue;
    if (!calcPassStatus(player, ph).canPass) break;
    player.phaseDone[ph] = true;
    const next = order[k+1];
    if (next) player.nobleCarry[next] = calcNobleCarryForward(player, ph);
  }
}

// 切換玩家：顯示該玩家目前進行中的關卡（第一個還沒過的關）
function applyPlayerSwitch(id) {
  const prev = getPlayer();
  syncPhaseProgress(prev);
  currentPlayerId = id;
  const player = getPlayer();
  syncPhaseProgress(player);
  if (player && player.stayPhase) {
    currentPhase = player.stayPhase; // 過關後選了「繼續抽牌」
  } else if (player) {
    if (!player.phaseDone['body']) currentPhase = 'body';
    else if (!player.phaseDone['mind']) currentPhase = 'mind';
    else if (!player.phaseDone['spirit']) currentPhase = 'spirit';
    else currentPhase = 'blueprint';
  } else {
    currentPhase = 'body';
  }
}

function switchPlayer(id) {
  applyPlayerSwitch(id);
  renderPlayerTabs();
  renderPhaseContent();
  document.getElementById('scrollArea').scrollTop = 0;
}

// ── PHASE ──
function setPhase(phase) {
  const sp = getPlayer();
  if (sp && sp.stayPhase && phase !== sp.stayPhase) sp.stayPhase = null;
  currentPhase = phase;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab-'+phase);
  if (tabEl) tabEl.classList.add('active');
  renderPhaseContent();
  document.getElementById('scrollArea').scrollTop = 0;
}

// ── MAIN RENDER ──
function renderPhaseContent() {
  if (!gameStarted) { renderSetup(); return; }
  const player = getPlayer();
  if (!player) return;

  let html = '';

  // phase chips — 身心靈 + 藍圖
  html += `<div class="phase-strip">
    ${PHASES.map(ph => {
      const s = calcPassStatus(player, ph);
      const active = ph === currentPhase ? 'active '+ph : '';
      const done = player.phaseDone[ph] ? 'done' : '';
      const cnt = player.phases[ph].filter(isInfoRoll).length;
      return `<div class="phase-chip ${ph} ${active} ${done}" onclick="setPhase('${ph}')">
        <div class="pc-name">${PHASE_NAMES[ph]}</div>
        <div class="pc-count">${cnt} 張訊息卡</div>
      </div>`;
    }).join('')}
    <div class="phase-chip blueprint ${currentPhase==='blueprint'?'active blueprint':''}" onclick="setPhase('blueprint')">
      <div class="pc-name">✦ 藍圖</div>
      <div class="pc-count">答案藍圖</div>
    </div>
  </div>`;

  // 藍圖模式 — FAB 隱藏，只渲染藍圖
  if (currentPhase === 'blueprint') {
    hideFab();
    const hs = document.getElementById('headerStatus');
    if (hs) hs.innerHTML = '';
    html += renderBlueprint(player);
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  showFab();

  const rolls = player.phases[currentPhase];
  const status = calcPassStatus(player, currentPhase);
  const carryIn = player.nobleCarry[currentPhase] || 0;
  if (carryIn > 0) {
    const CARRY_BTNS = [
      {key:'tarot',label:'探索'},{key:'tarot-minor',label:'真相'},
      {key:'guide',label:'指引'},{key:'issue',label:'議題'},
    ];
    for (let ci = 0; ci < carryIn; ci++) {
      const cr = rolls.find(r => r.fromCarry && r.carryIndex === ci);
      const ct = cr ? cr.cellType : '';
      // 已儲存 → 收起成一行，點一下可再展開修改
      if (cr && cr.carrySaved && cr.cardName) {
        const typeLabel = (CARRY_BTNS.find(t => t.key === ct) || {}).label || '';
        html += `<div class="carry-box carry-collapsed" onclick="editCarryNoble(${ci})">
          <div class="carry-title">⭐ 上一關帶來的貴人卡${carryIn>1?' #'+(ci+1):''}
            <span class="carry-state">已換成 ${typeLabel}：${cr.cardName}${cr.orientation?' '+cr.orientation:''}</span>
            <span class="carry-arrow">›</span></div>
        </div>`;
        continue;
      }
      const sel = cr && ct ? renderInfoCardSel(cr.id, ct, cr.cardName, cr.orientation, ct==='tarot-minor'?cr.tarotGroup:cr.guideGroup) : '';
      html += `<div class="carry-box">
        <div class="carry-title">⭐ 上一關帶來的貴人卡${carryIn>1?' #'+(ci+1):''}
          <span class="carry-state">${cr && cr.cardName ? '已換成：'+cr.cardName+(cr.orientation?' '+cr.orientation:'') : '需換成一張訊息卡'}</span></div>
        <div class="field-group"><div class="field-label">要換成的牌種</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${CARRY_BTNS.map(t=>`<button class="carry-type ${ct===t.key?'active':''}" onclick="useCarryNoble(${ci},'${t.key}')">${t.label}</button>`).join('')}
          </div></div>
        ${sel}
        ${cr ? `<div class="carry-actions">
          <button class="carry-save" ${cr.cardName?'':'disabled'} onclick="saveCarryNoble(${ci})">儲存</button>
        </div>` : ''}
      </div>`;
    }
  }

  // 更新 header 過關狀態
  const headerStatus = document.getElementById('headerStatus');
  if (headerStatus) {
    const pName = player.name || '玩家'+(player.id+1);
    const pColor = player.color || PLAYER_COLORS[player.id];
    const topic = player.topic ? `「${player.topic}」` : '';
    const playerTag = `<span style="font-weight:600;font-size:17px;letter-spacing:.02em;color:${pColor}">${pName}</span>${topic ? '<span style="font-size:12px;"> · <span style="font-style:italic;opacity:.8">' + topic + '</span></span>' : ''}`;
    const topRow = '<div style="padding:4px 12px 4px;font-size:12px;line-height:1.5;">' + playerTag + '</div>';

    const releaseLine = (status.pendingRelease
      ? '<div class="status-bar warn">🍃 還有 ' + status.pendingRelease + ' 張放下卡未執行，需先放下訊息牌才能過關</div>' : '')
      + (status.pendingCarry
      ? '<div class="status-bar warn">⭐ 還有 ' + status.pendingCarry + ' 張帶入的貴人卡要換成訊息卡</div>' : '');
    const conditionsMet = status.passA || status.passB;
    if (status.canPass) {
      const staying = player.stayPhase === currentPhase;
      const nextName = {body:'心', mind:'靈', spirit:''}[currentPhase];
      const goBtn = staying ? ` <button onclick="leaveStayPhase()" style="margin-left:auto;padding:3px 10px;border:none;border-radius:12px;background:var(--pass-c);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap;">${nextName ? '進入「'+nextName+'」關 →' : '前往藍圖 ✦'}</button>` : '';
      headerStatus.innerHTML = topRow + '<div class="status-bar pass">✅ ' + (staying ? '已過關，繼續抽牌中' : player.phaseDone[currentPhase] ? '此關已過關' : '已達過關條件') + goBtn + '</div>';
    } else if (conditionsMet) {
      // 條件都齊了，只差放下
      headerStatus.innerHTML = topRow + releaseLine;
    } else {
      const a = '方式①：' + Math.min(status.infoCount, 4) + '/4 張' + (status.has3Types ? '（塔羅✓ 議題✓ 指引✓）' : '（需含塔羅、議題、指引）') + (status.hasNoble ? ' 貴人✓' : '＋貴人卡×1');
      const b = '方式②：' + status.infoCount + '/7 張';
      const noble = '';
      const hint = (!status.blocked && status.releaseHint) ? '　' + status.releaseHint : '';
      const limit = status.atLimit ? '<div class="status-bar limit">🔴 已達9張上限，請確認是否過關</div>' : '';
      headerStatus.innerHTML = topRow + releaseLine + '<div class="status-bar warn">🎯 ' + a + '　' + b + noble + hint + '</div>' + limit;
    }
  }

  // rolls
  if (rolls.filter(r => !r.fromCarry).length === 0) {
    html += '<div class="empty-state">還沒有紀錄<br>點 ＋ 記錄這一步</div>';
  } else {
    const stepRolls = rolls.filter(r => !r.fromCarry);
    html += `<div class="round-log">${stepRolls.map((r, idx) => renderRoll(r, idx+1, stepRolls)).join('')}</div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
  updateDots();
  updateHandBar();
  updateFabVisibility();
}

function renderBlueprint(player) {
  // 每個關卡，玩家選出塔羅、議題、指引各1張
  // 初始化 blueprint 資料結構
  if (!player.blueprint) player.blueprint = {
    body:  {tarotId:null, tarotOrientation:'', issueId:null, guideId:null},
    mind:  {tarotId:null, tarotOrientation:'', issueId:null, guideId:null},
    spirit:{tarotId:null, tarotOrientation:'', issueId:null, guideId:null},
  };

  const bp = player.blueprint;

  let html = '';

  PHASES.forEach(ph => {
    const phName = PHASE_NAMES[ph];
    const allRolls = player.phases[ph];
    const handIdsBp = new Set(activeInfoRolls(allRolls).map(r => r.id));
    const rolls = allRolls.filter(r => !isInfoRoll(r) || handIdsBp.has(r.id));
    // 收集可選的牌
    // 依實際得到的牌種分類（含黃金格、附加貴人、附加命運之輪、帶入貴人換的牌）
    const handCards = rolls.filter(r => isInfoRoll(r) && r.cardName);
    const tarotRolls = handCards.filter(r => cardGroupOf(r)==='tarot' || infoTypeOf(r)==='golden');
    const issueRolls = handCards.filter(r => cardGroupOf(r)==='issue' || infoTypeOf(r)==='golden');
    const guideRolls = handCards.filter(r => cardGroupOf(r)==='guide' || infoTypeOf(r)==='golden');
    // 舊資料 extras 裡的得牌
    const extraCards = rolls.flatMap(r => (r.extras||[]).filter(e => e.cardName).map(e => ({cellType: e.nobleDice||e.destinyRole, cardName: e.cardName})));

    const tarotOpts = [...tarotRolls, ...extraCards.filter(e => e.cellType==='tarot'||e.cellType==='tarot-minor')];
    const issueOpts = [...issueRolls, ...extraCards.filter(e => e.cellType==='issue')];
    const guideOpts = [...guideRolls, ...extraCards.filter(e => e.cellType==='guide')];

    const sel = (field, opts, label) => {
      const cur = bp[ph][field];
      if (opts.length === 0) return `<div class="bp-empty">${label}：本關尚無此類牌卡</div>`;
      return `<div class="field-group"><div class="field-label">${label}</div>
        <select onchange="setBlueprintCard('${ph}','${field}',this.value)">
          <option value="">— 選擇 —</option>
          ${opts.map(r => `<option value="${r.cardName}" ${cur===r.cardName?'selected':''}>${r.cardName}</option>`).join('')}
        </select></div>`;
    };

    const isTarotSelected = bp[ph].tarotId;
    const isTarotMinor = tarotRolls.find(r => r.cardName===bp[ph].tarotId && cardGroupOf(r)==='tarot');

    const imgUrl = bp[ph].tarotId ? getCardImg(bp[ph].tarotId, bp[ph].tarotOrientation) : null;
    const issueImg = bp[ph].issueId ? getCardImg(bp[ph].issueId, '', 'issue') : null;
    const guideImg = bp[ph].guideId ? getCardImg(bp[ph].guideId, '') : null;

    html += `<div class="bp-phase-block">
      <div class="bp-phase-title ${ph}">${phName} 關</div>

      <div class="bp-card-row">
        <div class="bp-card-slot">
          <div class="bp-slot-label">塔羅牌</div>
          ${sel('tarotId', tarotOpts, '選擇塔羅牌')}
          ${isTarotSelected ? `<div class="field-group"><div class="field-label">正 / 逆位（可調整）</div>
            <div class="orient-btns">
              <button class="orient-btn ${bp[ph].tarotOrientation==='正位'?'active':''}" onclick="setBlueprintCard('${ph}','tarotOrientation','${bp[ph].tarotOrientation==='正位'?'':'正位'}')">正位</button>
              <button class="orient-btn ${bp[ph].tarotOrientation==='逆位'?'active':''}" onclick="setBlueprintCard('${ph}','tarotOrientation','${bp[ph].tarotOrientation==='逆位'?'':'逆位'}')">逆位</button>
            </div></div>` : ''}
          ${imgUrl ? `<img class="bp-card-img" src="${imgUrl}" alt="${bp[ph].tarotId}">` : ''}
        </div>
        <div class="bp-card-slot">
          <div class="bp-slot-label">議題卡</div>
          ${sel('issueId', issueOpts, '選擇議題卡')}
          ${issueImg ? `<img class="bp-card-img" src="${issueImg}" alt="${bp[ph].issueId}">` : ''}
        </div>
        <div class="bp-card-slot">
          <div class="bp-slot-label">指引卡</div>
          ${sel('guideId', guideOpts, '選擇指引卡')}
          ${guideImg ? `<img class="bp-card-img" src="${guideImg}" alt="${bp[ph].guideId}">` : ''}
        </div>
      </div>
    </div>`;
  });

  html += `<div class="field-group" style="margin-top:4px">
    <div class="field-label">核心啟發</div>
    <textarea rows="3" placeholder="這場遊戲給你的啟發…" oninput="getPlayer().insight=this.value">${player.insight||''}</textarea>
  </div>
  <div class="field-group">
    <div class="field-label">你打算如何實踐？</div>
    <textarea rows="3" placeholder="具體行動或心態調整…" oninput="getPlayer().action=this.value">${player.action||''}</textarea>
  </div>
  <div class="field-group">
    <div class="field-label">匯出</div>
    <div class="export-btns">
      <button class="export-btn primary" onclick="exportImage()">輸出成圖片</button>
      <button class="export-btn" onclick="exportForAI()">複製 AI 分析文字</button>
      <button class="export-btn" onclick="exportZip()">下載 ZIP（含照片）</button>
    </div>
  </div>`;

  return html;
}

function setBlueprintCard(ph, field, val) {
  const player = getPlayer(); if (!player) return;
  if (!player.blueprint) player.blueprint = {body:{},mind:{},spirit:{}};
  if (!player.blueprint[ph]) player.blueprint[ph] = {};
  player.blueprint[ph][field] = val;
  renderPhaseContent();
}

// 全場已經被拿走的牌（所有玩家、所有關卡）；被放下的牌會回到牌堆，可再被選
function takenCardNames(exceptId) {
  const set = new Set();
  players.forEach(p => PHASES.forEach(ph => {
    activeInfoRolls(p.phases[ph] || []).forEach(r => { if (r.cardName && r.id !== exceptId) set.add(r.cardName); });
  }));
  return set;
}

function renderInfoCardSel(rollId, cardType, curVal, curOrient, curGroup) {
  // 防呆：別人或別輪已經拿到的牌不出現在選項裡（自己這輪已選的保留）
  const taken = takenCardNames(rollId);
  const avail = o => o === curVal || !taken.has(o);
  if (cardType === 'issue') {
    const opts = CARD_OPTIONS['issue'].filter(avail).map(o=>`<option value="${o}" ${curVal===o?'selected':''}>${o}</option>`).join('');
    return `<div class="field-group"><div class="field-label">牌卡名稱</div>
      <select onchange="updateRoll(${rollId},'cardName',this.value)">
        <option value="">— 選擇 —</option>${opts}
      </select></div>`;
  }

  if (cardType === 'tarot') {
    const opts = CARD_OPTIONS['tarot'].filter(avail).map(o=>`<option value="${o}" ${curVal===o?'selected':''}>${o}</option>`).join('');
    const orientRow = `<div class="field-group"><div class="field-label">正 / 逆位</div>
      <div class="orient-btns">
        <button class="orient-btn ${curOrient==='正位'?'active':''}" onclick="updateRoll(${rollId},'orientation','${curOrient==='正位'?'':'正位'}');renderPhaseContent()">正位</button>
        <button class="orient-btn ${curOrient==='逆位'?'active':''}" onclick="updateRoll(${rollId},'orientation','${curOrient==='逆位'?'':'逆位'}');renderPhaseContent()">逆位</button>
      </div></div>`;
    return `<div class="field-group"><div class="field-label">牌卡名稱</div>
      <select onchange="updateRoll(${rollId},'cardName',this.value)">
        <option value="">— 選擇 —</option>${opts}
      </select></div>${orientRow}`;
  }

  if (cardType === 'tarot-minor') {
    const tg = curGroup || '';
    const groupCards = tg ? (TAROT_MINOR_GROUPS.find(g=>g.name===tg)?.cards||[]) : [];
    const suitRow = `<div class="field-group"><div class="field-label">牌組</div>
      <div class="suit-btns">
        ${TAROT_MINOR_GROUPS.map(g=>`<button class="suit-btn ${tg===g.name?'active':''}" onclick="updateRoll(${rollId},'tarotGroup','${tg===g.name?'':g.name}');renderPhaseContent()">
          <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit}</span>
        </button>`).join('')}
      </div></div>`;
    const cardSel = tg ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
      <select onchange="updateRoll(${rollId},'cardName',this.value)">
        <option value="">— 選擇 —</option>
        ${groupCards.filter(avail).map(c=>`<option value="${c}" ${curVal===c?'selected':''}>${c}</option>`).join('')}
      </select></div>` : '';
    const orientRow = tg ? `<div class="field-group"><div class="field-label">正 / 逆位</div>
      <div class="orient-btns">
        <button class="orient-btn ${curOrient==='正位'?'active':''}" onclick="updateRoll(${rollId},'orientation','${curOrient==='正位'?'':'正位'}');renderPhaseContent()">正位</button>
        <button class="orient-btn ${curOrient==='逆位'?'active':''}" onclick="updateRoll(${rollId},'orientation','${curOrient==='逆位'?'':'逆位'}');renderPhaseContent()">逆位</button>
      </div></div>` : '';
    return suitRow + cardSel + orientRow;
  }

  if (cardType === 'guide') {
    const gg = curGroup || '';
    const groupCards = gg ? (GUIDE_GROUPS.find(g=>g.name===gg)?.cards||[]) : [];
    const elemRow = `<div class="field-group"><div class="field-label">元素</div>
      <div class="suit-btns">
        ${GUIDE_GROUPS.map(g=>`<button class="suit-btn ${gg===g.name?'active':''}" onclick="updateRoll(${rollId},'guideGroup','${gg===g.name?'':g.name}');renderPhaseContent()">
          <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit}</span>
        </button>`).join('')}
      </div></div>`;
    const cardSel = gg ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
      <select onchange="updateRoll(${rollId},'cardName',this.value)">
        <option value="">— 選擇 —</option>
        ${groupCards.filter(avail).map(c=>`<option value="${c}" ${curVal===c?'selected':''}>${c}</option>`).join('')}
      </select></div>` : '';
    return elemRow + cardSel;
  }

  return '';
}

function renderRoll(r, idx, phaseRounds) {
  const ct = CELL_TYPES.find(c => c.key === r.cellType);
  const badgeCls = r.cellType ? CELL_CLASS[r.cellType] || 'none' : 'none';
  const badgeLabel = ct ? ct.label : '—';
  const isInfoCard = INFO_CELLS.includes(r.cellType);

  // photo
  // photo replaced by card image lookup
  const photoHTML = '';
  const aiHTML = '';

  const showOrientation = r.cellType === 'tarot' || r.cellType === 'tarot-minor';

  // ── helpers ──
  function cardSelectHTML(type, selectedVal, idPrefix) {
    if (type === 'guide') {
      return `<select onchange="updateRoll(${r.id},'${idPrefix}',this.value)">
        <option value="">— 選擇 —</option>
        ${GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${selectedVal===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
      </select>`;
    }
    if (type === 'tarot-minor') {
      return `<select onchange="updateRoll(${r.id},'${idPrefix}',this.value)">
        <option value="">— 選擇 —</option>
        ${TAROT_MINOR_GROUPS.map(g=>`<optgroup label="${g.icon} ${g.suit}">${g.cards.map(c=>`<option value="${c}" ${selectedVal===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
      </select>`;
    }
    const opts = CARD_OPTIONS[type] || [];
    return `<select onchange="updateRoll(${r.id},'${idPrefix}',this.value)">
      <option value="">— 選擇 —</option>
      ${opts.map(o=>`<option value="${o}" ${selectedVal===o?'selected':''}>${o}</option>`).join('')}
    </select>`;
  }

  // ── 主格子內容 ──
  const cardField = (() => {
    if (!r.cellType) return '';

    // ── 附加事件專屬 cardField ──
    if (r.isExtra) {
      const INFO_BTNS = [
        {key:'tarot',      label:'探索',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'tarot-minor',label:'真相',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'guide',      label:'指引',   bg:'var(--guide-bg)',   c:'var(--guide-c)'},
        {key:'issue',      label:'議題',   bg:'var(--issue-bg)',   c:'var(--issue-c)'},
      ];
      const typeRow = (field, extra=[]) => {
        const all = [...extra, ...INFO_BTNS];
        const cur = r[field] || '';
        return `<div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${all.map(t=>`<button onclick="updateRoll(${r.id},'${field}','${cur===t.key?'':t.key}');updateRoll(${r.id},'cardName','');updateRoll(${r.id},'tarotGroup','');updateRoll(${r.id},'guideGroup','');renderPhaseContent()" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${cur===t.key?t.c:'var(--border)'};background:${cur===t.key?t.bg:'transparent'};color:${cur===t.key?t.c:'var(--text-muted)'};font-size:12px;cursor:pointer;">${t.label}</button>`).join('')}
        </div>`;
      };

      // 貴人：選給的牌種
      if (r.cellType === 'noble') {
        const NOBLE_EXTRA = [{key:'release',label:'放下',bg:'var(--release-bg)',c:'var(--release-c)'},{key:'destiny',label:'命運之輪',bg:'var(--destiny-bg)',c:'var(--destiny-c)'}];
        const cardType = r.nobleCardType || '';
        let cardSel = '';
        if (['issue','tarot','tarot-minor','guide'].includes(cardType)) {
          cardSel = renderInfoCardSel(r.id, cardType, r.cardName, r.orientation, cardType==='tarot-minor'?r.tarotGroup:r.guideGroup);
        } else if (cardType === 'release') {
          cardSel = `<div style="font-size:12px;color:var(--release-c);background:var(--release-bg);border-radius:var(--radius);padding:8px 12px;margin-top:2px;">🍃 得到一張放下卡（不是貴人卡），需在本階段結束前放下等同張數的訊息牌</div>`;
        } else if (cardType === 'destiny') {
          // 命運之輪：再選牌種
          const dt = r.destinyCardType || '';
          const INFO_BTNS2 = [
            {key:'tarot',label:'探索',bg:'var(--tarot-bg)',c:'var(--tarot-c)'},
            {key:'tarot-minor',label:'真相',bg:'var(--tarot-bg)',c:'var(--tarot-c)'},
            {key:'guide',label:'指引',bg:'var(--guide-bg)',c:'var(--guide-c)'},
            {key:'issue',label:'議題',bg:'var(--issue-bg)',c:'var(--issue-c)'},
          ];
          const dtRow = `<div class="field-group"><div class="field-label">抽到的牌種</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${INFO_BTNS2.map(t=>`<button onclick="updateRoll(${r.id},'destinyCardType','${dt===t.key?'':t.key}');updateRoll(${r.id},'cardName','');updateRoll(${r.id},'tarotGroup','');updateRoll(${r.id},'guideGroup','');renderPhaseContent()" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${dt===t.key?t.c:'var(--border)'};background:${dt===t.key?t.bg:'transparent'};color:${dt===t.key?t.c:'var(--text-muted)'};font-size:12px;cursor:pointer;">${t.label}</button>`).join('')}
            </div></div>`;
          const dtCardSel = ['issue','tarot','tarot-minor','guide'].includes(dt)
            ? renderInfoCardSel(r.id, dt, r.cardName, r.orientation, dt==='tarot-minor'?r.tarotGroup:r.guideGroup)
            : '';
          cardSel = dtRow + dtCardSel;
        }
        return `<div class="rule-note noble"><div class="rule-note-title">⭐ 貴人（受到幫助）</div>
          <div class="rule-note-body">其他玩家給你一張牌，你得到的是那張牌，不會增加貴人卡</div></div>
          <div class="field-group"><div class="field-label">幫助你的玩家</div>
            <select onchange="updateRoll(${r.id},'noblePerson',this.value)">
              <option value="">— 選擇玩家 —</option>
              ${players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${r.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
            </select>
          </div>
          <div class="field-group"><div class="field-label">得到的牌種</div>
            ${typeRow('nobleCardType', NOBLE_EXTRA)}
          </div>${cardSel}`;
      }

      // 放下：選手上哪張牌放下
      if (r.cellType === 'release') {
        const player = getPlayer();
        const phRolls = player ? player.phases[currentPhase] : [];
        // 手上的牌（不算這一輪自己選的放下）
        const hand = activeInfoRolls(phRolls, r.id).filter(roll => roll.cardName && roll.collapsed && roll.id !== r.id);
        // 手上所有的牌都可以放下
        const dropable = hand;
        const { pending } = releaseCounts(phRolls.filter(roll => roll.id !== r.id));
        const cur = r.releasedCard && !dropable.some(roll => roll.cardName === r.releasedCard) ? r.releasedCard : '';
        return `<div class="rule-note release"><div class="rule-note-title">🍃 放下</div>
          <div class="rule-note-body">選一張手牌放下，執行一張放下卡${pending>0?`（目前待放下 ${pending} 張）`:'（目前沒有待執行的放下卡）'}</div></div>
          <div class="field-group"><div class="field-label">選擇要放下的牌</div>
            <select onchange="updateRoll(${r.id},'releasedCard',this.value)">
              <option value="">— 選擇 —</option>
              ${cur?`<option value="${cur}" selected disabled>${cur}（已不在手上，請重選）</option>`:''}
              ${dropable.map(roll=>`<option value="${roll.cardName}" ${r.releasedCard===roll.cardName?'selected':''}>${roll.cardName}（${CELL_TYPES.find(c=>c.key===infoTypeOf(roll))?.label||''}）</option>`).join('')}
              ${dropable.length===0?'<option disabled>尚無可放下的牌</option>':''}
            </select>
          </div>`;
      }

      // 命運之輪：選牌種
      if (r.cellType === 'destiny') {
        const cardType = r.destinyCardType || '';
        let cardSel = '';
        if (['issue','tarot','tarot-minor','guide'].includes(cardType)) {
          cardSel = renderInfoCardSel(r.id, cardType, r.cardName, r.orientation, cardType==='tarot-minor'?r.tarotGroup:r.guideGroup);
        }
        return `<div class="rule-note destiny"><div class="rule-note-title">🎡 命運之輪</div></div>
          <div class="field-group"><div class="field-label">抽到的牌種</div>
            ${typeRow('destinyCardType')}
          </div>${cardSel}`;
      }

      // 黃金格：選牌種
      if (r.cellType === 'golden') {
        const cardType = r.goldenCardType || '';
        let cardSel = '';
        if (['issue','tarot','tarot-minor','guide'].includes(cardType)) {
          cardSel = renderInfoCardSel(r.id, cardType, r.cardName, r.orientation, cardType==='tarot-minor'?r.tarotGroup:r.guideGroup);
        }
        return `<div class="rule-note golden"><div class="rule-note-title">✨ 黃金格</div></div>
          <div class="field-group"><div class="field-label">抽到的牌種</div>
            ${typeRow('goldenCardType')}
          </div>${cardSel}`;
      }
      return '';
    }

    if (r.cellType === 'noble') {
      return `<div class="rule-note noble"><div class="rule-note-title">⭐ 貴人格子</div>
        <div class="rule-note-body">領取貴人卡，擲貴人骰，依指示抽取牌卡給對方</div></div>
        <div class="field-group"><div class="field-label">幫助的玩家</div>
          <select onchange="updateRoll(${r.id},'noblePerson',this.value)">
            <option value="">— 選擇玩家 —</option>
            ${players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${r.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
          </select>
        </div>`;
    }

    if (r.cellType === 'release') {
      return `<div class="rule-note release"><div class="rule-note-title">🍃 放下格子</div>
        <div class="rule-note-body">領取一張放下卡，本階段結束前需放下等同張數的訊息牌</div></div>`;
    }

    if (r.cellType === 'destiny') {
      return `<div class="rule-note destiny"><div class="rule-note-title">🎡 命運之輪</div>
        <div class="rule-note-body">憑直覺抽一張訊息卡 → 所有人輪流擲骰 → 最大者得牌</div></div>`;
    }

    if (r.cellType === 'golden') {
      const INFO_BTNS = [
        {key:'tarot',      label:'探索',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'tarot-minor',label:'真相',   bg:'var(--tarot-bg)',   c:'var(--tarot-c)'},
        {key:'guide',      label:'指引',   bg:'var(--guide-bg)',   c:'var(--guide-c)'},
        {key:'issue',      label:'議題',   bg:'var(--issue-bg)',   c:'var(--issue-c)'},
      ];
      const gt = r.goldenCardType || '';
      let cardSel = '';
      if (['issue','tarot','tarot-minor','guide'].includes(gt)) {
        cardSel = renderInfoCardSel(r.id, gt, r.cardName, r.orientation, gt==='tarot-minor'?r.tarotGroup:r.guideGroup);
      }
      return `<div class="rule-note golden"><div class="rule-note-title">✨ 黃金格</div>
        <div class="rule-note-body">經過或停在此格，可任意抽取一張牌卡</div></div>
        <div class="field-group"><div class="field-label">抽到的牌種</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${INFO_BTNS.map(t=>`<button onclick="updateRoll(${r.id},'goldenCardType','${gt===t.key?'':t.key}');updateRoll(${r.id},'cardName','');updateRoll(${r.id},'tarotGroup','');updateRoll(${r.id},'guideGroup','');renderPhaseContent()" style="padding:6px 14px;border-radius:20px;border:1.5px solid ${gt===t.key?t.c:'var(--border)'};background:${gt===t.key?t.bg:'transparent'};color:${gt===t.key?t.c:'var(--text-muted)'};font-size:12px;cursor:pointer;">${t.label}</button>`).join('')}
          </div>
        </div>${cardSel}`;
    }

    if (r.cellType === 'issue') {
      return `<div class="field-group"><div class="field-label">牌卡名稱</div>
        <select onchange="updateRoll(${r.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${CARD_OPTIONS['issue'].map(o=>`<option value="${o}" ${r.cardName===o?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
    }

    if (r.cellType === 'tarot' || r.cellType === 'tarot-minor') {
      const isTarotMinor = r.cellType === 'tarot-minor';
      const groupSelect = isTarotMinor ? `<div class="field-group"><div class="field-label">牌組</div>
        <div class="suit-btns">
          ${TAROT_MINOR_GROUPS.map(g=>`<button class="suit-btn ${r.tarotGroup===g.name?'active':''}" onclick="updateRoll(${r.id},'tarotGroup','${r.tarotGroup===g.name?'':g.name}');renderPhaseContent()">
            <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit}</span>
          </button>`).join('')}
        </div></div>` : '';
      const groupCards = isTarotMinor
        ? (r.tarotGroup ? TAROT_MINOR_GROUPS.find(g=>g.name===r.tarotGroup)?.cards||[] : [])
        : CARD_OPTIONS['tarot'];
      const cardSelect = (!isTarotMinor||r.tarotGroup) ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
        <select onchange="updateRoll(${r.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${groupCards.map(o=>`<option value="${o}" ${r.cardName===o?'selected':''}>${o}</option>`).join('')}
        </select></div>` : '';
      return `${groupSelect}${cardSelect}
        <div class="field-group"><div class="field-label">正 / 逆位</div>
          <div class="orient-btns">
            <button class="orient-btn ${r.orientation==='正位'?'active':''}" data-val="正位" onclick="selectOrient(${r.id},'正位')">正位</button>
            <button class="orient-btn ${r.orientation==='逆位'?'active':''}" data-val="逆位" onclick="selectOrient(${r.id},'逆位')">逆位</button>
          </div></div>`;
    }

    if (r.cellType === 'guide') {
      const gg = r.guideGroup || '';
      const groupCards = gg ? GUIDE_GROUPS.find(g=>g.name===gg)?.cards || [] : [];
      return `<div class="field-group"><div class="field-label">元素</div>
        <div class="suit-btns">
          ${GUIDE_GROUPS.map(g=>`<button class="suit-btn ${gg===g.name?'active':''}" onclick="updateRoll(${r.id},'guideGroup','${gg===g.name?'':g.name}');renderPhaseContent()">
            <span class="suit-icon">${g.icon}</span><span class="suit-name">${g.suit||g.name.replace(/[🌬️💧🔥🌿\s]/g,'').slice(0,2)}</span>
          </button>`).join('')}
        </div></div>
        ${gg ? `<div class="field-group"><div class="field-label">牌卡名稱</div>
          <select onchange="updateRoll(${r.id},'cardName',this.value)">
            <option value="">— 選擇 —</option>
            ${groupCards.map(c=>`<option value="${c}" ${r.cardName===c?'selected':''}>${c}</option>`).join('')}
          </select></div>` : ''}`;
    }
    return '';
  })();

  // ── 附加事件 ──
  const extras = r.extras || [];
  const extraHTML = extras.length > 0 ? `
    <div class="extra-section">
      ${extras.map((ex, ei) => renderExtra(r, ex, ei)).join('')}
    </div>` : '';

  const isCollapsed = r.collapsed === true;
  // 只有擲骰子的輪次才算回合，附加事件不算
  const roundNo = (phaseRounds || []).slice(0, idx).filter(x => !x.isExtra).length;

  return `<div class="roll-entry ${isCollapsed?'collapsed':''} ${r.isExtra?'extra-roll':''}" id="roll-${r.id}">
    <div class="roll-header" onclick="toggleRoll(${r.id})">
      <div class="roll-meta">
        <span class="roll-num">${r.isExtra ? '✦ 附加' : '第 '+roundNo+' 輪'}</span>
        <span class="cell-badge ${badgeCls}">${badgeLabel}</span>
        ${isExtraNoble(r) && r.nobleCardType === 'release' ? `<span class="cell-badge release">放下</span>` : ''}
        ${r.cardName ? `<span style="font-size:12px;color:var(--text-dim)">${r.cardName}${r.orientation?' '+r.orientation:''}</span>` : ''}
        ${isReleaseAction(r) && r.releasedCard ? `<span style="font-size:12px;color:var(--text-dim)">放下：${r.releasedCard}</span>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="move-btn" ${idx<=1?'disabled':''} onclick="event.stopPropagation();moveRoll(${r.id},-1)" title="往上移">↑</button>
        <button class="move-btn" ${idx>=(phaseRounds||[]).length?'disabled':''} onclick="event.stopPropagation();moveRoll(${r.id},1)" title="往下移">↓</button>
        <span class="collapse-arrow">${isCollapsed?'›':'⌄'}</span>
        <button class="del-btn" onclick="event.stopPropagation();deleteRoll(${r.id})">×</button>
      </div>
    </div>
    <div class="roll-body" ${isCollapsed?'style="display:none"':''}>
      <div class="field-group">
        <div class="field-label">停在哪個格子</div>
        <div class="ct-btns">
          ${(r.isExtra ? CELL_TYPES.filter(c=>['destiny','noble','release','golden'].includes(c.key)).sort((a,b)=>['destiny','noble','release','golden'].indexOf(a.key)-['destiny','noble','release','golden'].indexOf(b.key)) : CELL_TYPES).map(c => {
            const active = r.cellType === c.key ? 'active '+(CELL_CLASS[c.key]||c.key) : '';
            return `<button class="ct-btn ${active}" onclick="selectCellType(${r.id},'${c.key}')">${c.label}</button>`;
          }).join('')}
        </div>
      </div>
      ${cardField}
      ${(()=>{
        const img = getCardImg(r.cardName, r.orientation, infoTypeOf(r));
        if (!img || !r.cardName) return '';
        const ct = CELL_TYPES.find(c=>c.key===r.cellType);
        return `<div class="card-img-wrap">
          <img class="card-img-thumb" src="${img}" alt="${r.cardName}">
          <div class="card-img-info">
            <div class="card-img-name">${r.cardName}</div>
            ${r.orientation ? `<div class="card-img-orient">${r.orientation}</div>` : ''}
            ${ct ? `<div class="card-img-type">${ct.label}</div>` : ''}
          </div>
        </div>`;
      })()}
      <div class="field-group">
        <div class="field-label">當下感受 / 備註</div>
        <textarea placeholder="這一步的感受或觀察…" oninput="updateRoll(${r.id},'note',this.value)">${r.note}</textarea>
      </div>
      ${extraHTML}
      <div class="roll-save-row">
        ${r.collapsed
          ? `<button class="roll-confirm-btn" onclick="confirmEdit(${r.id})">確認修改</button>
             <button class="roll-cancel-btn" onclick="cancelEdit(${r.id})">取消</button>`
          : `<button class="roll-save-btn" onclick="saveRoll(${r.id})">儲存這一輪</button>`
        }
      </div>
    </div>
  </div>`;
}

// ── ROLL ACTIONS ──
function toggleRoll(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = !r.collapsed; break; }
  }
  renderPhaseContent();
}

function confirmEdit(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = true; break; }
  }
  autoSave();
  renderPhaseContent();
  updateHandBar();
  showToast('已更新');
}

function cancelEdit(id) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.collapsed = true; break; }
  }
  renderPhaseContent();
}

function setPhaseToHand() {
  // 手牌 tab — 切換到手牌頁
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-hand')?.classList.add('active');
  hideFab();
  const hs = document.getElementById('headerStatus');
  if (hs) hs.innerHTML = '';
  const player = getPlayer();
  if (!player) return;
  document.getElementById('mainContent').innerHTML = renderHandPageHTML(player);
}

function renderHandPageHTML(player) {
  let html = '<div class="hand-page">';
  PHASES.forEach(ph => {
    const rolls = player.phases[ph];
    // 所有拿過的訊息牌都顯示；已放下的變灰
    const infoRolls = rolls.filter(r => isInfoRoll(r) && r.collapsed);
    const handIds = new Set(activeInfoRolls(rolls).map(r => r.id));
    const nobles = rolls.filter(r => isNobleCard(r) && r.collapsed);
    const rc = releaseCounts(rolls.filter(r => r.collapsed));

    if (!infoRolls.length && !nobles.length && !rc.cards) return;
    const phaseName = PHASE_NAMES[ph];
    const releaseNote = rc.cards ? `　·　放下 ${rc.cards} 次（已執行 ${Math.min(rc.done, rc.cards)}）` : '';
    html += `<div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">${phaseName} 關${releaseNote}</div>
      <div class="hand-grid">
        ${handItemsInOrder(rolls.filter(r => r.collapsed)).map(it => {
          if (it.kind === 'noble') return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:100%;aspect-ratio:2/3;border-radius:4px;${tokenStyle('noble')}font-size:18px;">貴人</div>
          <div class="hand-card-name">貴人</div>
        </div>`;
          if (it.kind === 'release') { const used = it.used; return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;${used?'opacity:.4;':''}">
          <div style="width:100%;aspect-ratio:2/3;border-radius:4px;${tokenStyle('release',used)}font-size:18px;">放下</div>
          <div class="hand-card-name">${used?'放下（已執行）':'放下'}</div>
        </div>`; }
          const r = it.roll, gone = it.gone;
          const img = getCardImg(r.cardName, r.orientation, infoTypeOf(r));
          const t = infoTypeOf(r);
          const cls = t==='tarot'||t==='tarot-minor' ? 'tarot-c' : t==='issue' ? 'issue-c' : t==='guide' ? 'guide-c' : 'golden-c';
          const bgMap = {'tarot-c':'linear-gradient(160deg,#e8d4b0,#c09050)','issue-c':'linear-gradient(160deg,#b8cce8,#6090c8)','guide-c':'linear-gradient(160deg,#c8b8e0,#9870c8)','golden-c':'linear-gradient(160deg,#f0dea0,#c8a030)'};
          return `<div class="hand-card-item" style="${gone?'filter:grayscale(1);opacity:.4;':''}" onclick="showLightbox('${img||''}','${r.cardName||''}','${r.orientation||''}')">
            <div class="hand-card-img-wrap">
              ${img ? `<img src="${img}" alt="${r.cardName}" loading="lazy" decoding="async">` : `<div class="hand-card-no-img" style="background:${bgMap[cls]||bgMap['tarot-c']}">${(r.cardName||'').slice(0,2)}</div>`}
            </div>
            <div class="hand-card-name">${r.cardName||''}${r.orientation?' '+r.orientation:''}${gone?'（已放下）':''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function showLightbox(imgUrl, name, orient) {
  if (!imgUrl) { showToast('此牌無圖片'); return; }
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.onclick = () => lb.remove();
  lb.innerHTML = `<img src="${imgUrl}" alt="${name}"><div class="lightbox-info">${name}${orient?' · '+orient:''}</div>`;
  document.body.appendChild(lb);
}

function newGame() {
  const m = document.createElement('div');
  m.id = 'newGameModal';
  m.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(44,34,24,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;';
  m.innerHTML = `<div style="background:var(--surface);border-radius:var(--radius);padding:24px 20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">

    <div style="font-size:13px;color:var(--text-muted);line-height:1.6;">目前紀錄會自動存入歷史，之後可從首頁叫出。</div>
    <div style="display:flex;gap:8px;">
      <button onclick="document.getElementById('newGameModal').remove();_doNewGame()" style="flex:1;padding:12px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,#A07850,#7C5C38);color:#fff;font-size:14px;cursor:pointer;">確認</button>
      <button onclick="document.getElementById('newGameModal').remove()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;">取消</button>
