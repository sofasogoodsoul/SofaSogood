function _doNewGame() {
  archiveCurrentSession();
  localStorage.removeItem(LS_CURRENT);
  gameStarted = false;
  players = [];
  currentPhase = 'body';
  nextId = 1;
  window._sessionDate = new Date().toISOString().slice(0,10);
  window._sessionName = '';
  hideFab();
  const ptb = document.getElementById('playerTabsBar');
  if (ptb) ptb.innerHTML = '';
  initPlayers(2);
  renderSetup();
}

function updateHandBar() {
  const bar = document.getElementById('handBar');
  if (!bar || !gameStarted) return;
  const player = getPlayer();
  if (!player) return;

  bar.innerHTML = '<span class="hand-bar-label">手牌</span>';

  // 只顯示當前關卡的牌
  const rolls = player.phases[currentPhase] || [];
  // 依操作步驟的順序排列
  handItemsInOrder(rolls).forEach(it => {
    if (it.kind === 'info') {
      const r = it.roll, gone = it.gone;
      const img = getCardImg(r.cardName, r.orientation, infoTypeOf(r));
      const div = document.createElement('div');
      div.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;overflow:hidden;box-shadow:0 2px 5px rgba(124,98,72,0.22);cursor:pointer;' + (gone ? 'filter:grayscale(1);opacity:.4;' : '');
      if (img) {
        div.innerHTML = `<img src="${img}" style="width:100%;height:100%;object-fit:cover;" alt="${r.cardName}" decoding="async">`;
      } else {
        const bg = infoTypeOf(r)==='issue'?'#8090c0':infoTypeOf(r)==='guide'?'#9070c0':'#c0a060';
        div.style.background = bg;
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.justifyContent = 'center';
        div.style.fontSize = '9px';
        div.style.color = '#fff';
        div.style.textAlign = 'center';
        div.textContent = (r.cardName||'').slice(0,2);
      }
      div.title = r.cardName + (r.orientation?' '+r.orientation:'') + (gone?'（已放下）':'');
      div.onclick = () => showLightbox(img, r.cardName, r.orientation);
      bar.appendChild(div);
    } else if (it.kind === 'noble') {
      const t = document.createElement('div');
      t.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;box-sizing:border-box;font-size:10px;' + tokenStyle('noble');
      t.textContent = '貴人';
      t.title = '貴人卡';
      bar.appendChild(t);
    } else {
      const used = it.used;
      const t = document.createElement('div');
      t.style.cssText = 'flex-shrink:0;width:32px;height:50px;border-radius:3px;box-sizing:border-box;font-size:10px;' + tokenStyle('release', used) + (used ? 'opacity:.5;' : '');
      t.textContent = '放下';
      t.title = used ? '放下卡（已執行）' : '放下卡（未執行）';
      bar.appendChild(t);
    }
  });
}

function saveRoll(id) {
  const player = getPlayer(); if (!player) return;
  // 判斷這是新增輪次還是編輯已存的（collapsed=true 的才是已存的）
  let wasCollapsed = false;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { wasCollapsed = r.collapsed; r.collapsed = true; break; }
  }
  updateHandBar();
  autoSave();
  const status = calcPassStatus(player, currentPhase);
  if (status.canPass && !player.phaseDone[currentPhase]) {
    // 達標 → 自動進入下一關
    const phase = currentPhase;
    const nextPhase = phase === 'body' ? 'mind' : phase === 'mind' ? 'spirit' : null;
    goNextPhase(nextPhase);
    saveCurrentSession();
    archiveCurrentSession();
    showPassModal(player, phase, status);
  } else {
    renderPhaseContent();
  }
}

function showPassModal(player, phase, status) {
  const PHASE_NAMES = {body:'身', mind:'心', spirit:'靈'};
  const nextPhase = phase === 'body' ? 'mind' : phase === 'mind' ? 'spirit' : null;
  const passWay = status.passA ? '方式①（4 張訊息卡含塔羅、議題、指引＋貴人）' : '方式②（任意 7 張訊息卡）';

  const modal = document.createElement('div');
  modal.id = 'passModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:flex-end;justify-content:center;background:rgba(44,34,24,0.5);backdrop-filter:blur(4px);';
  modal.innerHTML = `<div style="width:100%;max-width:480px;background:linear-gradient(160deg,#FDFCF9,#F7F2E8);border-radius:20px 20px 0 0;padding:28px 22px 36px;display:flex;flex-direction:column;gap:16px;">
    <div style="width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 4px;"></div>
    <div style="text-align:center;">
      <div style="font-size:28px;margin-bottom:8px;">✨</div>
      <div style="font-family:var(--font);font-size:18px;color:var(--text);letter-spacing:.06em;margin-bottom:6px;">「${PHASE_NAMES[phase]}」關達標</div>
      <div style="font-size:13px;color:var(--text-muted);">${passWay}</div>
    </div>
    <div style="background:linear-gradient(135deg,var(--pass-bg),#E4F2EA);border-radius:8px;padding:14px 16px;font-size:13px;color:var(--pass-c);line-height:1.8;">
      訊息卡 ${status.infoCount} 張 · 貴人卡 ${status.totalNobles} 張<br>
      可以直接進入下一關，或留在這關繼續抽牌
    </div>
    <button onclick="closePassModal()" style="width:100%;padding:14px;background:linear-gradient(135deg,#A07850,#7C5C38);border:none;border-radius:6px;color:#fff;font-size:15px;font-family:var(--font);letter-spacing:.08em;cursor:pointer;">
      ${nextPhase ? `進入「${PHASE_NAMES[nextPhase]}」關（知道了）` : '前往答案藍圖（知道了）'}
    </button>
    <button onclick="stayInPhase('${phase}')" style="width:100%;padding:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:14px;cursor:pointer;letter-spacing:.04em;">
      繼續抽牌（留在「${PHASE_NAMES[phase]}」關，最多 9 張）
    </button>
  </div>`;
  document.body.appendChild(modal);
}

// 過關後選擇繼續抽牌：回到這關，之後切換玩家也會回到這關
function stayInPhase(phase) {
  closePassModal();
  const player = getPlayer(); if (!player) return;
  // 移除剛進下一關時自動新增、還沒填的空白輪
  const order = ['body','mind','spirit'];
  const next = order[order.indexOf(phase)+1];
  if (next) {
    const arr = player.phases[next];
    const last = arr[arr.length-1];
    if (last && !last.cellType && !last.cardName) arr.pop();
  }
  player.stayPhase = phase;
  setPhase(phase);
  autoSave();
}

// 停留抽牌結束 → 進入下一關
function leaveStayPhase() {
  const player = getPlayer(); if (!player) return;
  const phase = player.stayPhase || currentPhase;
  // 空白輪不留
  const arr = player.phases[phase];
  const last = arr[arr.length-1];
  if (last && !last.cellType && !last.cardName) arr.pop();
  player.stayPhase = null;
  const order = ['body','mind','spirit'];
  const next = order[order.indexOf(phase)+1];
  if (next) player.nobleCarry[next] = calcNobleCarryForward(player, phase);
  setPhase(next || 'blueprint');
  autoSave();
}

function closePassModal() {
  const m = document.getElementById('passModal');
  if (m) m.remove();
}

function goNextPhase(next) {
  closePassModal();
  const player = getPlayer();
  if (player) player.phaseDone[currentPhase] = true;
  if (next) {
    if (player) player.nobleCarry[next] = calcNobleCarryForward(player, currentPhase);
    setPhase(next);
  } else {
    setPhase('blueprint');
  }
}

function addRoll() {
  const player = getPlayer();
  if (!player) return;
  // collapse all previous rolls in this phase
  player.phases[currentPhase].forEach(r => { r.collapsed = true; });
  player.phases[currentPhase].push({
    id: nextId++, dice: null, cellType:'', cardName:'', orientation:'', tarotGroup:'', note:'', extras:[], collapsed: false
  });
  renderPhaseContent();
  setTimeout(() => { const a = document.getElementById('scrollArea'); a.scrollTop = a.scrollHeight; }, 60);
}

// 用上一關帶來的貴人卡換一張訊息牌
function useCarryNoble(ci, type) {
  const player = getPlayer(); if (!player) return;
  const arr = player.phases[currentPhase];
  let cr = arr.find(r => r.fromCarry && r.carryIndex === ci);
  if (!cr) {
    cr = { id: nextId++, cellType:'', cardName:'', orientation:'', tarotGroup:'', guideGroup:'', note:'', extras:[], collapsed:true, fromCarry:true, carryIndex:ci };
    // 放在最前面（照順序排在這關第一輪之前）
    const firstStep = arr.findIndex(r => !r.fromCarry);
    arr.splice(firstStep < 0 ? arr.length : firstStep, 0, cr);
  }
  if (cr.cellType !== type) { cr.cellType = type; cr.cardName = ''; cr.orientation = ''; cr.tarotGroup = ''; cr.guideGroup = ''; }
  renderPhaseContent();
  autoSave();
}
function saveCarryNoble(ci) {
  const player = getPlayer(); if (!player) return;
  const cr = player.phases[currentPhase].find(r => r.fromCarry && r.carryIndex === ci);
  if (!cr || !cr.cardName) { showToast('請先選擇牌卡'); return; }
  cr.carrySaved = true;
  saveRoll(cr.id); // 收起、存檔並檢查是否過關
}
function editCarryNoble(ci) {
  const player = getPlayer(); if (!player) return;
  const cr = player.phases[currentPhase].find(r => r.fromCarry && r.carryIndex === ci);
  if (cr) cr.carrySaved = false;
  renderPhaseContent();
}
function cancelCarryNoble(ci) {
  const player = getPlayer(); if (!player) return;
  player.phases[currentPhase] = player.phases[currentPhase].filter(r => !(r.fromCarry && r.carryIndex === ci));
  renderPhaseContent();
  autoSave();
}

// 手動調整步驟順序
function moveRoll(id, dir) {
  const player = getPlayer(); if (!player) return;
  const arr = player.phases[currentPhase];
  const i = arr.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length || arr[j].fromCarry) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderPhaseContent();
  updateHandBar();
  autoSave();
  setTimeout(() => { const el = document.getElementById('roll-'+id); if (el) el.scrollIntoView({block:'nearest'}); }, 30);
}

function deleteRoll(id) {
  const player = getPlayer();
  if (!player) return;
  player.phases[currentPhase] = player.phases[currentPhase].filter(r => r.id !== id);
  renderPhaseContent();
}

function updateRoll(id, field, val) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r[field] = val; break; }
  }
  updateDots();
  if (field === 'cardName') updateHandBar();
  if (field === 'cardName') {
    const pl = getPlayer();
    const cr = pl && pl.phases[currentPhase].find(r => r.id === id);
    if (cr && cr.fromCarry) { renderPhaseContent(); autoSave(); return; }
  }
}

function selectCellType(id, key) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) {
      const prev = r.cellType;
      r.cellType = (prev === key) ? '' : key;
      if (prev !== r.cellType) { r.cardName = ''; r.orientation = ''; }
      break;
    }
  }
  renderPhaseContent();
}

function selectOrient(id, val) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.orientation = (r.orientation === val) ? '' : val; break; }
  }
  const btns = document.querySelectorAll(`#roll-${id} .orient-btn`);
  btns.forEach(b => b.classList.toggle('active', b.dataset.val === (() => {
    for (const ph of PHASES) { const r = getPlayer()?.phases[ph].find(r => r.id === id); if (r) return r.orientation; } return '';
  })()));
}

function dismissAi(id) {
  const player = getPlayer();
  if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r => r.id === id);
    if (r) { r.aiResult = null; break; }
  }
  renderPhaseContent();
}

// ── PHOTO ──

function addExtra(rollId, type) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) {
      if (!r.extras) r.extras=[];
      r.extras.push({id:nextId++,type,cardName:'',orientation:'',destinyWinner:'',noblePerson:'',nobleRole:'',nobleDice:'',releasedCard:'',destinyCardType:''});
      r.collapsed = false;
      break;
    }
  }
  renderPhaseContent();
  setTimeout(() => {
    const el = document.getElementById('roll-' + rollId);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 60);
}

function removeExtra(rollId, extraId) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) { r.extras = (r.extras||[]).filter(e=>e.id!==extraId); break; }
  }
  renderPhaseContent();
}

function updateExtra(rollId, extraId, field, val) {
  const player = getPlayer(); if (!player) return;
  for (const ph of PHASES) {
    const r = player.phases[ph].find(r=>r.id===rollId);
    if (r) { const ex = (r.extras||[]).find(e=>e.id===extraId); if (ex) ex[field]=val; break; }
  }
  updateDots();
}

function updateExtraAndRefresh(rollId, extraId, field, val) {
  updateExtra(rollId, extraId, field, val);
  renderPhaseContent();
}

function renderExtra(r, ex, ei) {
  const playerOpts = players.map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${ex.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('');
  const othersOpts = players.filter(p=>p.id!==currentPlayerId).map(p=>`<option value="${p.name||'玩家'+(p.id+1)}" ${ex.noblePerson===(p.name||'玩家'+(p.id+1))?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('');
  const allCardSel = (field) => `<select onchange="updateExtra(${r.id},${ex.id},'${field}',this.value)">
    <option value="">— 選擇 —</option>
    <optgroup label="探索">${CARD_OPTIONS['tarot'].map(o=>`<option value="${o}" ${ex[field]===o?'selected':''}>${o}</option>`).join('')}</optgroup>
    <optgroup label="真相">${TAROT_MINOR_GROUPS.map(g=>`<optgroup label="${g.icon} ${g.suit}">${g.cards.map(c=>`<option value="${c}" ${ex[field]===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</optgroup>
    <optgroup label="議題">${CARD_OPTIONS['issue'].map(o=>`<option value="${o}" ${ex[field]===o?'selected':''}>${o}</option>`).join('')}</optgroup>
    <optgroup label="指引">${GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex[field]===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</optgroup>
  </select>`;

  let body = '';
  if (ex.type === 'destiny') {
    const DESTINY_TYPES = [
      {key:'issue',label:'議題',icon:'🔵'},
      {key:'tarot-minor',label:'真相',icon:'🟠'},
      {key:'tarot',label:'探索',icon:'⭐'},
      {key:'guide',label:'指引',icon:'🟢'},
    ];
    const dt = ex.destinyCardType || '';
    const cardOpts = (() => {
      if (!dt) return '';
      if (dt === 'guide') {
        return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
        </select></div>`;
      }
      if (dt === 'tarot-minor') {
        return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
          <option value="">— 選擇 —</option>
          ${TAROT_MINOR_GROUPS.map(g=>`<optgroup label="${g.icon} ${g.suit}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
        </select></div>`;
      }
      const opts = CARD_OPTIONS[dt] || [];
      return `<div class="field-group"><div class="field-label">牌卡名稱</div><select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
        <option value="">— 選擇 —</option>
        ${opts.map(o=>`<option value="${o}" ${ex.cardName===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
    })();
    body = `<div class="field-group"><div class="field-label">① 牌種</div>
      <div class="suit-btns" style="flex-wrap:wrap;">
        ${DESTINY_TYPES.map(t=>`<button class="suit-btn ${dt===t.key?'active':''}" onclick="updateExtraAndRefresh(${r.id},${ex.id},'destinyCardType','${dt===t.key?'':t.key}')" style="width:60px;">
          <span class="suit-icon">${t.icon}</span><span class="suit-name">${t.label}</span>
        </button>`).join('')}
      </div></div>
      ${cardOpts}
      <div class="field-group"><div class="field-label">② 得牌玩家</div>
        <select onchange="updateExtra(${r.id},${ex.id},'destinyWinner',this.value)">
          <option value="">— 選擇玩家 —</option>
          ${playerOpts}
        </select>
      </div>`;
  } else if (ex.type === 'noble') {
    body = '';
    if (true) { ex.nobleRole = 'receiver'; {
      body += `<div class="field-group"><div class="field-label">貴人是誰</div>
        <select onchange="updateExtra(${r.id},${ex.id},'noblePerson',this.value)"><option value="">— 選擇 —</option>${othersOpts}</select></div>
      <div class="field-group"><div class="field-label">貴人骰骰到</div>
        <select onchange="updateExtraAndRefresh(${r.id},${ex.id},'nobleDice',this.value)">
          <option value="">— 選擇 —</option>
          <option value="release" ${ex.nobleDice==='release'?'selected':''}>放下</option>
          <option value="destiny" ${ex.nobleDice==='destiny'?'selected':''}>命運之輪</option>
          <option value="issue"   ${ex.nobleDice==='issue'?'selected':''}>議題</option>
          <option value="tarot-minor" ${ex.nobleDice==='tarot-minor'?'selected':''}>真相</option>
          <option value="tarot"   ${ex.nobleDice==='tarot'?'selected':''}>探索</option>
          <option value="guide"   ${ex.nobleDice==='guide'?'selected':''}>指引</option>
        </select></div>
      ${ex.nobleDice && ex.nobleDice!=='release' && ex.nobleDice!=='destiny' ? `
        <div class="field-group"><div class="field-label">得到的牌卡</div>
          <select onchange="updateExtra(${r.id},${ex.id},'cardName',this.value)">
            <option value="">— 選擇 —</option>
            ${ex.nobleDice==='guide'
              ? GUIDE_GROUPS.map(g=>`<optgroup label="${g.icon}">${g.cards.map(c=>`<option value="${c}" ${ex.cardName===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')
              : (CARD_OPTIONS[ex.nobleDice]||[]).map(o=>`<option value="${o}" ${ex.cardName===o?'selected':''}>${o}</option>`).join('')}
          </select></div>` : ''}`;
    }}
  } else if (ex.type === 'release') {
    // 計算這個關卡目前收到的訊息牌
    const player = getPlayer();
    const phRolls = player ? player.phases[currentPhase] : [];
    const infoRolls = phRolls.filter(roll => INFO_CELLS.includes(roll.cellType) && roll.cardName);
    // 計算放下卡數量（主格子 + 附加事件）
    const releaseCount = phRolls.reduce((acc, roll) => {
      if (roll.cellType === 'release') acc++;
      (roll.extras||[]).forEach(e => { if (e.type === 'release') acc++; });
      return acc;
    }, 0);
    // 已放下的（其他附加事件中）
    const alreadyReleased = phRolls.flatMap(roll =>
      (roll.extras||[]).filter(e => e.type === 'release' && e.id !== ex.id && e.releasedCard).map(e => e.releasedCard)
    );
    const availableCards = infoRolls.filter(roll => !alreadyReleased.includes(roll.cardName));
    body = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">放下卡數：${releaseCount} 張，可放下 ${releaseCount} 張訊息牌</div>
    <div class="field-group"><div class="field-label">選擇要放下的牌</div>
      <select onchange="updateExtra(${r.id},${ex.id},'releasedCard',this.value)">
        <option value="">— 選擇 —</option>
        ${availableCards.map(roll=>`<option value="${roll.cardName}" ${ex.releasedCard===roll.cardName?'selected':''}>${roll.cardName}（${CELL_TYPES.find(c=>c.key===roll.cellType)?.label||''}）</option>`).join('')}
        ${infoRolls.length===0?'<option disabled>— 尚無訊息牌可放下 —</option>':''}
      </select>
    </div>`;
  } else if (ex.type === 'golden') {
    body = `<div style="font-size:12px;color:#92680a;margin-bottom:4px">經過或停在此格，可任意抽取一張牌卡</div>
    <div class="field-group"><div class="field-label">抽到的牌卡</div>
      ${allCardSel('cardName')}
    </div>`;
  }

  const labels = {destiny:'🎡 命運之輪', noble:'⭐ 貴人', release:'🍃 放下牌', golden:'✨ 黃金格'};
  return `<div class="extra-card">
    <div class="extra-card-hd">
      <span class="extra-card-label">${labels[ex.type]||ex.type}</span>
      <button class="del-btn" onclick="removeExtra(${r.id},${ex.id})">×</button>
    </div>
    <div class="extra-card-body">${body}</div>
  </div>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── DRAWER ──
function openDrawer() {
  renderDrawer();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function renderDrawer() {
  if (!gameStarted) {
    document.getElementById('drawerBody').innerHTML = '<div class="empty-state">遊戲尚未開始</div>';
    return;
  }
  const player = getPlayer();
  const playerSelect = `<div class="field-group"><div class="field-label">查看玩家</div>
    <select onchange="switchPlayerDrawer(parseInt(this.value))">
      ${((typeof ONLINE !== 'undefined' && ONLINE && ONLINE.mode === 'player') ? players.filter(p => p.id === ONLINE.pid) : players).map(p=>`<option value="${p.id}" ${p.id===currentPlayerId?'selected':''}>${p.name||'玩家'+(p.id+1)}</option>`).join('')}
    </select></div>`;

  const summaryHTML = PHASES.map(ph => {
    const rolls = player.phases[ph];
    const status = calcPassStatus(player, ph);
    return `<div class="scard">
      <div class="scard-hd ${ph}"><span>${PHASE_NAMES[ph]} 關</span>
        <span style="font-size:12px;opacity:.7">${status.infoCount} 張訊息卡 ${status.canPass?'· ✅':''}${status.atLimit?'· 已達上限':''}</span>
      </div>
      <div class="scard-bd">
        ${rolls.length===0?'<span style="font-size:12px;color:var(--text-dim);font-style:italic">尚未記錄</span>':rolls.map((r,i)=>{
          const ct = CELL_TYPES.find(c=>c.key===r.cellType);
          return `<div class="scard-row"><span class="scard-idx">#${i+1}</span><span>${ct?ct.label:'—'}${r.cardName?' · '+r.cardName:''}${r.orientation?' '+r.orientation:''}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('drawerBody').innerHTML = `<div class="info-section">
    ${playerSelect}
    <div><div class="info-label" style="margin-bottom:8px">遊戲進度</div><div class="summary-grid">${summaryHTML}</div></div>
    <div class="field-group">
      <div class="info-label" style="margin-bottom:4px">遊戲結語</div>
      <div class="field-label" style="margin-bottom:5px">核心啟發</div>
      <textarea rows="3" placeholder="這場遊戲給你的啟發…" oninput="getPlayer().insight=this.value">${player.insight||''}</textarea>
      <div class="field-label" style="margin-top:8px;margin-bottom:5px">你打算如何實踐？</div>
      <textarea rows="3" placeholder="具體行動或心態調整…" oninput="getPlayer().action=this.value">${player.action||''}</textarea>
    </div>
  </div>`;

  document.getElementById('drawerBody').querySelector('select') &&
    document.getElementById('drawerBody').querySelectorAll('textarea').forEach((ta, i) => {
      if (i===0) ta.addEventListener('input', e => { getPlayer().insight = e.target.value; });
      if (i===1) ta.addEventListener('input', e => { getPlayer().action = e.target.value; });
    });
}

function switchPlayerDrawer(id) {
  applyPlayerSwitch(id);
  renderPlayerTabs();
  renderPhaseContent();
  renderDrawer();
}

// ── EXPORT ──
function exportForAI() {
  const player = getPlayer(); if (!player) return;
  const text = buildAIPrompt(player);
  const done = () => showToast('已複製 AI 提示文字');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { showToast('複製失敗'); }
  ta.remove();
}

// 產生給 AI 的引導提示
function buildAIPrompt(player) {
  const pName = p => p.name || '玩家' + (p.id + 1);
  const LAYER = { body:'行動層', mind:'情感層', spirit:'靈魂層' };
  const LAYER_DESC = {
    body:'行動力，以及外在環境對玩家的影響',
    mind:'情緒起伏、想法與心情的變化',
    spirit:'內在的呼喚、靈魂使命，以及深層的擔憂',
  };
  const TYPE_LABEL = { tarot:'探索', 'tarot-minor':'真相', issue:'議題', guide:'指引', golden:'黃金格', noble:'貴人', release:'放下', destiny:'命運之輪', first:'第一格' };
  const TYPE_DESC = {
    tarot:'探索：大阿爾克納，代表心靈層面的探索，也是意識中的原型',
    'tarot-minor':'真相：小阿爾克納，代表正在發生的事件；權杖火、聖杯水、寶劍風、錢幣土',
    issue:'議題：玩家帶來的問題背後的心理課題，往往是卡住的原因',
    guide:'指引：來自宇宙或內在高我的訊息，常呼應前一張牌',
    noble:'貴人：玩家成為別人的貴人，反映他平常幫助人的方式',
    release:'放下：主題中需要放下的部分',
    destiny:'命運之輪：牌的歸屬由擲骰決定，不一定落在翻牌的人手上',
    golden:'黃金格：玩家自由選擇抽哪一種牌',
  };
  const TYPE_ORDER = ['tarot','tarot-minor','issue','guide','noble','release','destiny','golden'];
  const SUIT = [['權杖','火'],['聖杯','水'],['寶劍','風'],['錢幣','土']];
  const suitOf = name => (SUIT.find(([s]) => (name||'').startsWith(s)) || null);
  const cardText = r => r.cardName ? r.cardName + (r.orientation ? '（' + r.orientation + '）' : '') : '';

  // 每關實際的步驟（排除空白輪）
  const stepsOf = ph => player.phases[ph].filter(r => !r.fromCarry && (r.cellType || r.cardName));
  const entered = PHASES.filter(ph => stepsOf(ph).length || player.phases[ph].some(r => r.fromCarry && r.cardName));
  const others = players.filter(p => p.id !== player.id).map(pName);

  // 已放下的牌（名稱 → 何時放下）
  const releasedInfo = {};
  PHASES.forEach(ph => {
    let round = 0;
    player.phases[ph].forEach(r => {
      if (!r.fromCarry && !r.isExtra && r.cellType) round++;
      if (isReleaseAction(r) && r.releasedCard) releasedInfo[r.releasedCard] = { ph, round, note: r.note || '' };
    });
  });

  // 本局出現的類型
  const seen = new Set();
  entered.forEach(ph => player.phases[ph].forEach(r => {
    if (r.fromCarry) { if (r.cardName) seen.add(r.cellType); return; }
    if (!r.cellType) return;
    // 附加貴人是「受到幫助」，不列入貴人（成為別人的貴人）的說明
    if (r.cellType !== 'first' && !isExtraNoble(r)) seen.add(r.cellType);
    const t = infoTypeOf(r); if (t && t !== 'golden') seen.add(t);
  }));

  // 進度文字
  const progress = PHASES.map(ph => {
    if (!entered.includes(ph)) return `未進入${PHASE_NAMES[ph]}關`;
    if (player.phaseDone[ph]) return `完成${PHASE_NAMES[ph]}關` + (player.stayPhase === ph ? '（過關後繼續抽牌中）' : '');
    const rounds = stepsOf(ph).filter(r => !r.isExtra).length;
    return `${PHASE_NAMES[ph]}關進行中（第 ${rounds} 輪）`;
  }).join('；');

  // 藍圖
  const bp = player.blueprint || {};
  const bpPhases = PHASES.filter(ph => { const b = bp[ph] || {}; return b.tarotId || b.issueId || b.guideId; });
  const hasBlueprint = bpPhases.length > 0;
  const drawnOrientation = (ph, name) => { const r = player.phases[ph].find(x => x.cardName === name); return r ? r.orientation || '' : ''; };
  const bpTarot = ph => {
    const b = bp[ph] || {}; if (!b.tarotId) return '—';
    const o = b.tarotOrientation || '';
    const drawn = drawnOrientation(ph, b.tarotId);
    const diff = drawn && o && drawn !== o ? `〔抽到時為${drawn}〕` : '';
    return b.tarotId + (o ? '（' + o + '）' : '') + diff;
  };

  let t = '';
  t += `你是《答案》桌遊的引導者，不是解答者。
這個遊戲相信答案已經存在於玩家心中，你的任務是幫他看見，而不是告訴他。
- 你可以說明牌卡的象徵，指出紀錄中的模式與呼應
- 你不替他下結論，不告訴他「你需要的是什麼」「你應該怎麼做」
- 你用提問把他帶回自己身上，讓他自己說出答案

## 遊戲背景

《答案》分為身、心、靈三關，依序推進。每關收集訊息卡（探索、真相、議題、指引）才能過關。三關結束後，玩家從每關選出塔羅、議題、指引各一張，組成「答案藍圖」。

本局玩家實際進入的關卡如下，未進入的關卡不列出：
`;
  entered.forEach(ph => { t += `- ${PHASE_NAMES[ph]}（${LAYER[ph]}）：${LAYER_DESC[ph]}\n`; });
  t += `\n本局出現的格子與牌卡：\n`;
  TYPE_ORDER.filter(k => seen.has(k)).forEach(k => { t += `- ${TYPE_DESC[k]}\n`; });

  t += `
## 本局資訊
- 玩家：${pName(player)}
- 議題：${player.topic || '（未填）'}
- 日期：${window._sessionDate || new Date().toISOString().slice(0,10)}
- 進度：${progress}
- 答案藍圖：${hasBlueprint ? '已完成' : '未製作'}
`;
  if (others.length) t += `- 同局玩家：${others.join('、')}\n`;

  t += `
## 遊玩紀錄

標記說明：
- 「第 N 輪」是擲骰停下的格子；「✦ 附加」是擲骰以外的事件，不算回合
- 「〔已放下〕」表示這張牌後來被放下，不計入過關
- 「—」表示該格不抽牌或未填寫感受，不代表玩家沒有感受
`;

  const notedCards = [];
  const allCardsSeq = []; // 依順序的有效牌
  let lastAction = null;
  entered.forEach(ph => {
    const rolls = player.phases[ph];
    const st = calcPassStatus(player, ph);
    const rc = releaseCounts(rolls);
    const handIds = new Set(activeInfoRolls(rolls).map(r => r.id));
    t += `\n### ${PHASE_NAMES[ph]}關〔${player.phaseDone[ph] ? '已過關' : '進行中'}〕｜有效訊息卡 ${st.infoCount} 張${rc.cards ? `｜放下 ${rc.cards} 次` : ''}\n`;
    const carryIn = player.nobleCarry[ph] || 0;
    if (carryIn) {
      const used = rolls.filter(r => r.fromCarry && r.cardName && r.carryIndex < carryIn);
      const list = used.map(r => `${cardText(r)}（${TYPE_LABEL[r.cellType]}）${handIds.has(r.id) ? '' : '〔已放下〕'}`);
      const keep = carryIn - used.length;
      if (keep > 0) list.push(`${keep} 張尚未換牌`);
      t += `帶入貴人卡 ${carryIn} 張，換成：${list.join('、')}\n`;
      used.forEach(r => { if (handIds.has(r.id)) allCardsSeq.push({ r, ph }); });
    }
    t += '\n';
    let round = 0;
    rolls.forEach(r => {
      if (r.fromCarry || !(r.cellType || r.cardName)) return;
      const gone = isInfoRoll(r) && r.cardName && !handIds.has(r.id);
      const tag = gone ? '〔已放下〕' : '';
      const suit = infoTypeOf(r) === 'tarot-minor' || (r.cellType === 'tarot-minor') ? suitOf(r.cardName) : null;
      const suitTag = suit ? `〔${suit[0]}・${suit[1]}〕` : '';
      const where = r.isExtra ? `${PHASE_NAMES[ph]}關附加事件` : `${PHASE_NAMES[ph]}關第 ${round + 1} 輪`;
      let line;
      if (r.isExtra) {
        if (isExtraNoble(r)) {
          const who = r.noblePerson ? `由 ${r.noblePerson} 幫助，` : '受到其他玩家幫助，';
          line = r.nobleCardType === 'release' ? `✦ 附加 貴人｜${who}得到一張放下卡`
               : `✦ 附加 貴人｜${who}得到${r.cardName && TYPE_LABEL[infoTypeOf(r)] ? ' ' + TYPE_LABEL[infoTypeOf(r)] : ''} ${cardText(r) || '—'}${suitTag}${tag}`;
        } else if (isReleaseAction(r)) {
          line = `✦ 附加 放下｜放下了 ${r.releasedCard || '—'}`;
        } else if (r.cellType === 'destiny') {
          line = `✦ 附加 命運之輪｜得到${r.cardName && TYPE_LABEL[infoTypeOf(r)] ? ' ' + TYPE_LABEL[infoTypeOf(r)] : ''} ${cardText(r) || '—'}${suitTag}${tag}`;
        } else {
          const tp = infoTypeOf(r);
          line = `✦ 附加 ${TYPE_LABEL[r.cellType] || '—'}｜${cardText(r) || '—'}${tp && tp !== r.cellType && TYPE_LABEL[tp] ? '（' + TYPE_LABEL[tp] + '）' : ''}${suitTag}${tag}`;
        }
        t += line + '\n';
        if (r.note) t += `  感受：${r.note}\n`;
      } else {
        round++;
        let cell = TYPE_LABEL[r.cellType] || '—';
        if (r.cellType === 'golden' && r.goldenCardType && TYPE_LABEL[r.goldenCardType]) cell += `（${TYPE_LABEL[r.goldenCardType]}）`;
        line = `第 ${round} 輪｜${cell}｜${cardText(r) || '—'}${suitTag}${tag}`;
        t += line + '\n';
        t += `  感受：${r.note || '—'}\n`;
      }
      if (r.cardName && r.note && isInfoRoll(r)) notedCards.push(`${cardText(r)}｜${where}｜${r.note}`);
      if (isInfoRoll(r) && r.cardName && handIds.has(r.id)) allCardsSeq.push({ r, ph });
      lastAction = r;
    });
    if (player.stayPhase === ph) t += '過關後玩家選擇留在本關繼續抽牌\n';
  });

  // 步驟走向：每關的起、轉、合
  const stepLabel = (r, n) => {
    const where = r.isExtra ? '✦ 附加' : `第 ${n} 輪`;
    let what;
    if (isExtraNoble(r)) what = r.nobleCardType === 'release' ? '受到幫助，得到放下卡' : `受到幫助，得到 ${cardText(r) || '—'}`;
    else if (isReleaseAction(r)) what = `放下 ${r.releasedCard || '—'}`;
    else {
      const tp = infoTypeOf(r);
      let cell = TYPE_LABEL[r.cellType] || '—';
      if (r.cellType === 'golden' && tp && TYPE_LABEL[tp]) cell += `（${TYPE_LABEL[tp]}）`;
      if (r.isExtra && r.cellType === 'destiny' && tp && TYPE_LABEL[tp]) cell += `（${TYPE_LABEL[tp]}）`;
      what = cell + (r.cardName ? ' ' + cardText(r) : '');
    }
    return `${where} ${what}`;
  };
  let flow = '';
  entered.forEach(ph => {
    let n = 0;
    const seq = [];
    player.phases[ph].forEach(r => {
      if (r.fromCarry || !(r.cellType || r.cardName)) return;
      if (!r.isExtra) n++;
      if (r.cellType === 'first') return;
      seq.push({ r, n });
    });
    if (!seq.length) return;
    const first = seq[0];
    const last = seq[seq.length - 1];
    // 轉折：放下、命運之輪、貴人、受助，以及塔羅正逆位的變化
    const turns = [];
    let prevOri = '';
    seq.forEach((x, k) => {
      const r = x.r;
      if (k > 0 && k < seq.length - 1 || (k > 0 && seq.length <= 2)) {
        if (isReleaseAction(r) || r.cellType === 'release' || r.cellType === 'destiny' || r.cellType === 'noble' || isExtraNoble(r)) turns.push(stepLabel(r, x.n));
      }
      const g = cardGroupOf(r);
      if (g === 'tarot' && r.orientation) {
        if (prevOri && prevOri !== r.orientation) turns.push(`${stepLabel(r, x.n)}（塔羅由${prevOri}轉為${r.orientation}）`);
        prevOri = r.orientation;
      }
    });
    const carryUsed = player.phases[ph].filter(r => r.fromCarry && r.cardName);
    flow += `\n### ${PHASE_NAMES[ph]}關\n`;
    if (carryUsed.length) flow += `- 帶入：以上一關的貴人卡換得 ${carryUsed.map(cardText).join('、')}\n`;
    flow += `- 起：${stepLabel(first.r, first.n)}\n`;
    if (turns.length) flow += `- 轉：${[...new Set(turns)].join('／')}\n`;
    if (last !== first) flow += `- 合：${stepLabel(last.r, last.n)}${player.phaseDone[ph] ? '（過關前的最後一步）' : '（目前的最後一步）'}\n`;
  });
  if (flow) t += `\n## 步驟走向\n以下依步驟順序整理每關的起、轉、合，「承」請從遊玩紀錄中的其餘步驟看出發展：\n` + flow;

  if (hasBlueprint) {
    t += `\n## 答案藍圖\n| 關卡 | 塔羅 | 議題 | 指引 |\n|---|---|---|---|\n`;
    bpPhases.forEach(ph => { const b = bp[ph]; t += `| ${PHASE_NAMES[ph]} | ${bpTarot(ph)} | ${b.issueId || '—'} | ${b.guideId || '—'} |\n`; });
    t += '\n';
    if (player.insight) t += `玩家寫下的核心啟發：${player.insight}\n`;
    if (player.action) t += `玩家寫下的實踐方式：${player.action}\n`;
  }

  // 提問錨點
  t += `\n## 提問錨點\n以下由紀錄整理，供你判斷這局的脈絡重心：\n\n`;
  if (hasBlueprint) {
    const nine = bpPhases.flatMap(ph => { const b = bp[ph]; return [b.tarotId ? bpTarot(ph) : null, b.issueId, b.guideId].filter(Boolean).map(c => `${PHASE_NAMES[ph]}：${c}`); });
    t += `- 藍圖中他選的牌：${nine.join('、')}\n`;
    if (player.insight || player.action) t += `- 他寫下的核心啟發與實踐：${player.insight || '—'}／${player.action || '—'}\n`;
  }
  if (notedCards.length) t += `- 他寫了感受的牌：\n${notedCards.map(x => '  - ' + x).join('\n')}\n`;

  // 重複出現的模式
  const patterns = [];
  entered.forEach(ph => {
    const seq = stepsOf(ph).filter(r => !r.isExtra && r.cellType);
    let k = 0;
    while (k < seq.length) {
      let j = k; while (j + 1 < seq.length && seq[j + 1].cellType === seq[k].cellType) j++;
      if (j - k + 1 >= 2 && seq[k].cellType !== 'first') patterns.push(`${PHASE_NAMES[ph]}關連續 ${j - k + 1} 輪停在${TYPE_LABEL[seq[k].cellType]}`);
      k = j + 1;
    }
  });
  const allInfo = entered.flatMap(ph => player.phases[ph].filter(r => isInfoRoll(r) && r.cardName));
  SUIT.forEach(([s]) => { const n = allInfo.filter(r => r.cardName.startsWith(s)).length; if (n >= 3) patterns.push(`${s}牌組出現 ${n} 次`); });
  const rev = allInfo.filter(r => r.orientation === '逆位').length;
  if (rev >= 3) patterns.push(`逆位 ${rev} 張`);
  if (patterns.length) t += `- 重複出現的模式：${patterns.join('／')}\n`;

  const relList = Object.entries(releasedInfo).map(([name, v]) => {
    const r = allInfo.find(x => x.cardName === name);
    const o = r && r.orientation ? '（' + r.orientation + '）' : '';
    const felt = (r && r.note) || v.note ? '有寫下感受' : '未寫感受';
    return `${name}${o}｜${PHASE_NAMES[v.ph]}關第 ${v.round} 輪後放下｜${felt}`;
  });
  if (relList.length) t += `- 放下的牌：\n${relList.map(x => '  - ' + x).join('\n')}\n`;

  let end;
  if (hasBlueprint) end = '藍圖與核心啟發';
  else {
    const lastPh = entered[entered.length - 1];
    const last = allCardsSeq.filter(x => x.ph === lastPh).slice(-2).map(x => cardText(x.r));
    end = lastPh ? `最後進入的關卡為${PHASE_NAMES[lastPh]}關${last.length ? '，最後的有效牌：' + last.join('、') : ''}` : '—';
  }
  if (lastAction && isReleaseAction(lastAction)) end += '（本局以放下作結）';
  t += `\n- 脈絡終點：${end}\n`;

  t += `
## 解讀原則
1. 只解讀玩家實際走過的內容。
   - 未進入的關卡：完全不提及，不推測、不預告，也不給「進入下一關時可留意」之類的話
   - 進入但未過關的關卡：視為進行中的狀態，不解讀成卡住、失敗或阻礙
   - 停在哪裡本身不代表任何意義，可能只是遊戲時間的安排
2. 塔羅依一般象徵說明。議題卡與指引卡是本遊戲專屬牌卡，請依牌名字面與前後文理解，不要假裝知道官方牌義。
3. 說明牌義時用開放的語氣，提供可能的方向，不作斷定。
   可以：「審判常與重新評估、被召喚有關，逆位時有時是還沒準備好回應」
   避免：「審判逆位代表你在逃避改變」
4. 留意順序與模式：指引與前一張牌的呼應、同一格重複出現、同一牌組連續出現、正逆位的變化。
5. 放下的牌和保留的牌可以一起看，但不要預設放下有特別的意義。
   有些玩家放下一張牌，只是對它沒有感受。
   除非他對這張牌寫了感受，或它和脈絡重心明顯相關，否則只當作紀錄的一部分，不另外解讀，也不暗示迴避。
6. 貴人事件反映他與他人的互動方式，可連結到議題本身。
7. 藍圖中塔羅的正逆位由玩家自選，若與抽到時不同，可以指出這一點。
8. 玩家寫下的感受、核心啟發與實踐方式是主體。引用時只做映照與連結，不詮釋他的動機。
9. 始終回扣議題。語氣平穩，避免宿命論、絕對斷言與空泛的鼓勵語。
10. 把每一關的步驟當成一段起承轉合來讀：
   - 起：這關從哪裡開始。第一步停在什麼格子、拿到什麼牌，常能看出這關切入議題的方式
   - 承：接下來的牌如何延續或回應開頭
   - 轉：放下、命運之輪、貴人、受到幫助、正逆位的變化，可能是這關的轉折
   - 合：過關前的最後一步，這關怎麼收尾
   起的位置可參考以下方向，用開放語氣提出，不作斷定：
   - 起於議題：一開始就碰到核心課題，這關可能從直面卡住的地方出發
   - 起於探索：從內在的探索與原型出發
   - 起於真相：從正在發生的事件切入
   - 起於指引：還沒遇到課題就先得到方向
   - 起於貴人：先從幫助別人開始，可以看看這和他在議題中如何給出、如何付出有沒有關係
   - 起於放下：一開始就面對需要放下的部分
   - 起於命運之輪：開局的走向交給外在與他人
   - 起於黃金格：一開始就能自己選擇要看見什麼
   - 起於受到幫助：這關從接受他人的支持開始
   轉與合同樣只提出可能的意義，不預設哪一種走向比較好。

## 輸出格式

`;
  const allDone = PHASES.every(ph => player.phaseDone[ph]);
  const bodyOnly = entered.length === 1 && entered[0] === 'body';
  if (allDone && hasBlueprint) {
    t += `1. 各關的起承轉合：依步驟順序說明這關怎麼開始、如何發展、在哪裡轉折、如何收尾，並點出關鍵牌的象徵（每關 200–300 字）
2. 三關的整體脈絡：從身到心到靈，紀錄中呈現的變化
3. 收束
`;
  } else if (bodyOnly && calcPassStatus(player, 'body').infoCount < 3) {
    t += `1. 這幾張牌的象徵、出現的先後順序，以及它們之間的關係（精簡即可，不需要湊滿篇幅）
2. 收束
`;
  } else {
    t += `1. 已走過關卡的起承轉合：依步驟順序說明怎麼開始、如何發展、在哪裡轉折、如何收尾（每關 200–300 字）
2. 收束
`;
  }

  t += `
## 收束

### 這局浮現的主題
用一句話（30 字內）點出這局牌卡共同浮現的主題。
這是觀察，不是結論，也不是給他的建議。

### 留給你的問題

先依「提問錨點」判斷這局的脈絡重心，也就是對他最有份量的那張牌或那個模式。
判斷順序：
1. 藍圖中他選的牌，以及核心啟發提到的內容
2. 他寫了感受的牌
3. 重複出現的模式
4. 脈絡終點

放下的牌只有在他寫了感受，或與重心明顯相關時，才作為提問素材。

接著提出 3 個問題，順序固定：
1. 看見：從脈絡重心出發，先用一句話說明這張牌的象徵，再請他說出在生活中的對應，或這張牌對他的意義
2. 連結：把重心與紀錄中的另一條線索放在一起（前後呼應的牌、重複的模式、有意義的放下、脈絡終點），請他說出他看見了什麼
3. 改變：從整局出發，請他說出自己想做的改變

提問規則：
- 每題都要扣住本局實際出現的牌或事件，帶入牌名
- 開放式提問，不能用是非題回答
- 不提供選項，避免「是 A 還是 B」「A 或 B」的句式
- 不在問題裡預先描述他可能的感受或答案，也不藏答案在問題裡
- 只使用他實際走過的關卡與事件
- 若他寫了實踐方式，第 3 題請他把自己的想法說得更具體，而不是另給方向

最後用一句話邀請他寫下自己的回答，不再補充建議。

## 若玩家回覆
玩家可能會在對話中回答這些問題。這時：
- 映照他說的話，幫他整理與聚焦
- 若他的回答還很模糊，再追問一題，同樣遵守上面的提問規則
- 他說出的改變就是答案；你只協助他把它變得可行，例如什麼時候開始、第一步是什麼
- 不要用你的建議取代他的答案
`;
  return t;
}

async function exportZip() {
  showToast('打包中…');
  const zip = new JSZip();
  const allData = { exportTime: new Date().toISOString(), players: players.map(p => {
    const phases = {};
    PHASES.forEach(ph => { phases[ph] = p.phases[ph].map(r => { const {photo,...rest} = r; return rest; }); });

  })};
  zip.file('紀錄.json', JSON.stringify(allData, null, 2));

  showToast('已下載');
}

const LS_KEY = 'sofasogood_sessions';
const LS_CURRENT = 'sofasogood_current';

function saveCurrentSession() {
  if (typeof ONLINE !== 'undefined' && ONLINE) return; // 連線版存在雲端
  try {
    const data = {
      date: window._sessionDate || new Date().toISOString().slice(0,10),
      name: window._sessionName || '',
      savedAt: Date.now(),
      players, currentPlayerId, currentPhase, nextId
    };
    localStorage.setItem(LS_CURRENT, JSON.stringify(data));
  } catch(e) {}
}

function loadCurrentSession() {
  try {
    const raw = localStorage.getItem(LS_CURRENT);
    if (!raw) return false;
    const data = JSON.parse(raw);
    players = data.players || [];
    currentPlayerId = data.currentPlayerId || 0;
    currentPhase = data.currentPhase || 'body';
    nextId = data.nextId || 1;
    window._sessionDate = data.date || new Date().toISOString().slice(0,10);
    window._sessionName = data.name || '';
    return true;
  } catch(e) { return false; }
}

function archiveCurrentSession() {
  if (typeof ONLINE !== 'undefined' && ONLINE) return;
  try {
    const raw = localStorage.getItem(LS_CURRENT);
    if (!raw) return;
    const data = JSON.parse(raw);
    const all = loadAllSessions();
    // 用 date+savedAt 做唯一 key，避免重複
    const id = data.date + '_' + (data.savedAt || Date.now());
    const existing = all.findIndex(s => s.id === id);
    if (existing >= 0) all[existing] = {...data, id};
    else all.unshift({...data, id});
    // 最多保留 30 場
    localStorage.setItem(LS_KEY, JSON.stringify(all.slice(0, 30)));
  } catch(e) {}
}

function loadAllSessions() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  } catch(e) { return []; }
}

function autoSave() {
  if (gameStarted) saveCurrentSession();
}

// 同網域的圖片直接用瀏覽器快取（畫面上已經載過的不用重抓）；
// 只有跨網域的圖才需要 crossOrigin 與避開快取
const _imgCache = new Map();
function loadCardImage(url) {
  if (!url) return Promise.resolve(null);
  if (_imgCache.has(url)) return _imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    let abs; try { abs = new URL(url, location.href); } catch (e) { abs = null; }
    const cross = abs && abs.origin !== location.origin;
    let done = false;
    const finish = v => { if (!done) { done = true; if (!v) _imgCache.delete(url); resolve(v); } };
    img.onload = () => finish(img);
    img.onerror = () => finish(null);
    setTimeout(() => finish(null), 6000);
    if (cross) { img.crossOrigin = 'anonymous'; img.src = url + (url.includes('?') ? '&' : '?') + 'export=1'; }
    else img.src = url;
  });
  _imgCache.set(url, p);
  return p;
}

function wrapText(ctx, text, maxW) {
  const lines = []; let line = '';
  for (const ch of String(text || '')) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function exportImage() {
  const player = getPlayer(); if (!player) return;
  showToast('圖片產生中…');
  const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const W = 1080, PAD = 64, CW = 150, GAP = 20;
  const PH_COLOR = { body:'#A03020', mind:'#2050A0', spirit:'#6040A8' };
  const TYPE_BG = { tarot:['#e8d4b0','#c09050'], 'tarot-minor':['#e8d4b0','#c09050'], issue:['#b8cce8','#6090c8'], guide:['#c8b8e0','#9870c8'], golden:['#f0dea0','#c8a030'] };
  const pName = player.name || '玩家' + (player.id + 1);
  const pColor = player.color || PLAYER_COLORS[player.id] || '#7C5C38';
  const date = window._sessionDate || new Date().toISOString().slice(0,10);

  // ── 資料 ──
  const sections = PHASES.map(ph => ({ ph, items: handItemsInOrder(player.phases[ph].filter(r => r.collapsed)), status: calcPassStatus(player, ph) }));
  const bp = player.blueprint || {};
  const bpCards = PHASES.map(ph => {
    const b = bp[ph] || {};
    return { ph, cards: [
      { label:'塔羅', name:b.tarotId, ori:b.tarotOrientation || '', type:'tarot' },
      { label:'議題', name:b.issueId, ori:'', type:'issue' },
      { label:'指引', name:b.guideId, ori:'', type:'guide' },
    ] };
  }).filter(r => r.cards.some(c => c.name));

  // ── 載入圖片 ──
  const imgMap = new Map();   // key → Image|null
  const jobs = [];
  sections.forEach(s => s.items.filter(it => it.kind === 'info').forEach(it => {
    const key = 'r' + it.roll.id;
    jobs.push(loadCardImage(getCardImg(it.roll.cardName, it.roll.orientation, infoTypeOf(it.roll))).then(v => imgMap.set(key, v)));
  }));
  bpCards.forEach(row => row.cards.filter(c => c.name).forEach(c => {
    const key = `bp-${row.ph}-${c.type}`;
    jobs.push(loadCardImage(getCardImg(c.name, c.ori, c.type)).then(v => imgMap.set(key, v)));
  }));
  await Promise.all(jobs);
  const imgTotal = imgMap.size;
  const imgFailed = [...imgMap.values()].filter(v => !v).length;

  // ── 共用繪圖 ──
  const mkText = (ctx, draw) => (t, x, y, size, color, weight = 400, align = 'left', style = '') => {
    ctx.font = `${style} ${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
    if (draw) ctx.fillText(t, x, y);
  };
  // 頁首：品牌、日期、玩家、議題；compact 版給各關頁
  const header = (ctx, draw, compact) => {
    const text = mkText(ctx, draw);
    let y = PAD;
    text('SofaSogood ✦ 答案', PAD, y, 26, '#8C6E4E');
    const sess = sessionLabel();
    text(sess ? `${sess}　${date}` : date, W - PAD, y + 2, 22, '#A8998A', 400, 'right');
    y += 56;
    text(pName, PAD, y, compact ? 36 : 52, pColor, 700); y += compact ? 52 : 72;
    if (player.topic) {
      const size = compact ? 24 : 30;
      ctx.font = `italic 400 ${size}px ${FONT}`;
      wrapText(ctx, '「' + player.topic + '」', W - PAD * 2).forEach(l => { text(l, PAD, y, size, '#5C4A38', 400, 'left', 'italic'); y += size + 14; });
    }
    y += 16;
    if (draw) { ctx.fillStyle = '#E6DCCB'; ctx.fillRect(PAD, y, W - PAD * 2, 2); }
    return y + 36;
  };
  // 畫一張牌（圖片保持原比例；沒有圖就畫色塊）
  const drawCard = (ctx, x, y, w, h, opt) => {
    const { img, kind, type, name, faded, used } = opt;
    ctx.save();
    if (faded) ctx.globalAlpha = 0.38;
    roundRectPath(ctx, x, y, w, h, 10); ctx.save(); ctx.clip();
    if (kind === 'info') {
      if (img) {
        ctx.drawImage(img, x, y, w, h);
        if (faded) { ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#888'; ctx.fillRect(x, y, w, h); }
      } else {
        const [c1, c2] = TYPE_BG[type] || TYPE_BG.tarot;
        const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, faded ? '#ddd' : c1); g.addColorStop(1, faded ? '#aaa' : c2);
        ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
        ctx.font = `600 26px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        wrapText(ctx, name || '', w - 24).slice(0, 4).forEach((l, k, arr) => ctx.fillText(l, x + w / 2, y + h / 2 + (k - (arr.length - 1) / 2) * 34));
      }
    } else {
      const g = ctx.createLinearGradient(x, y, x + w * 0.6, y + h);
      if (kind === 'noble') { g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.55, '#F4F0E9'); g.addColorStop(1, '#DDD5C8'); }
      else if (used) { g.addColorStop(0, '#C4BEB6'); g.addColorStop(0.55, '#A39D95'); g.addColorStop(1, '#86807A'); }
      else { g.addColorStop(0, '#5A4A3C'); g.addColorStop(0.55, '#2C2218'); g.addColorStop(1, '#0E0B08'); }
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      const word = kind === 'noble' ? '貴人' : '放下';
      ctx.font = `700 38px ${FONT}`; ctx.fillStyle = kind === 'noble' ? '#3C2E22' : '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(word[0], x + w / 2, y + h / 2 - 24); ctx.fillText(word[1], x + w / 2, y + h / 2 + 24);
    }
    ctx.restore();
    roundRectPath(ctx, x, y, w, h, 10); ctx.strokeStyle = kind === 'noble' ? '#D8CFC2' : '#E0D6C6'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  };
  const heightFor = (img, w) => img && img.naturalWidth ? Math.round(w * img.naturalHeight / img.naturalWidth) : Math.round(w * 1.5);
  const labelUnder = (ctx, label, x, y, w) => {
    ctx.font = `400 22px ${FONT}`; ctx.fillStyle = '#5C4A38'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    wrapText(ctx, label, w + 10).slice(0, 2).forEach((l, k) => ctx.fillText(l, x + w / 2, y + k * 28));
  };

  // ── 第 1 頁：身心靈藍圖 ──
  const renderBlueprintPage = (ctx, draw) => {
    const text = mkText(ctx, draw);
    let y = header(ctx, draw, false);
    text('✦ 答案藍圖', PAD, y, 38, '#8C6E4E', 700); y += 70;
    if (!bpCards.length) {
      text('尚未製作答案藍圖', PAD, y, 28, '#A8998A'); y += 60;
    }
    const LABEL_W = 70, CGAP = 22;
    const cardW = Math.floor((W - PAD * 2 - LABEL_W - CGAP * 2) / 3);
    bpCards.forEach(row => {
      const boxes = row.cards.map(c => {
        const img = c.name ? imgMap.get(`bp-${row.ph}-${c.type}`) : null;
        return { c, img, h: heightFor(img, cardW) };
      });
      const rowH = Math.max(...boxes.map(b => b.h));
      text(PHASE_NAMES[row.ph], PAD, y + 8, 40, PH_COLOR[row.ph], 700);
      boxes.forEach((b, k) => {
        const x = PAD + LABEL_W + k * (cardW + CGAP);
        if (!draw) return;
        if (b.c.name) {
          drawCard(ctx, x, y, cardW, b.h, { img: b.img, kind: 'info', type: b.c.type, name: b.c.name });
          labelUnder(ctx, b.c.name + (b.c.ori ? ' ' + b.c.ori : ''), x, y + b.h + 10, cardW);
        } else {
          ctx.save(); ctx.setLineDash([8, 8]); roundRectPath(ctx, x, y, cardW, Math.round(cardW * 1.5), 10);
          ctx.strokeStyle = '#D8CFC2'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
          labelUnder(ctx, b.c.label + '（未選）', x, y + Math.round(cardW * 1.5) + 10, cardW);
        }
      });
      y += rowH + 80;
    });
    [['核心啟發', player.insight], ['如何實踐', player.action]].forEach(([k, v]) => {
      if (!v) return;
      text(k, PAD, y, 30, '#8C6E4E', 700); y += 48;
      ctx.font = `400 28px ${FONT}`;
      wrapText(ctx, v, W - PAD * 2).forEach(l => { text(l, PAD, y, 28, '#3C2E22'); y += 42; });
      y += 24;
    });
    return y + PAD - 20;
  };

  // ── 第 2–4 頁：各關的牌 ──
  const renderPhasePage = sec => (ctx, draw) => {
    const text = mkText(ctx, draw);
    let y = header(ctx, draw, true);
    const st = sec.status;
    const rc = releaseCounts(player.phases[sec.ph]);
    text(PHASE_NAMES[sec.ph] + ' 關', PAD, y, 44, PH_COLOR[sec.ph], 700);
    const meta = `${st.infoCount} 張訊息卡${player.phaseDone[sec.ph] ? ' · 已過關 ✓' : ''}${rc.cards ? ` · 放下 ${rc.cards} 次` : ''}`;
    text(meta, PAD + 140, y + 14, 24, '#8C7B6A');
    y += 80;
    if (!sec.items.length) { text('這關還沒有紀錄', PAD, y, 28, '#A8998A'); return y + 60 + PAD; }
    // 依順序由左到右排，放不下就換行；指引卡放大
    const GW = CW * 2 + GAP, MAXW = W - PAD * 2, LABEL_H = 88;
    const boxes = sec.items.map(it => {
      const img = it.kind === 'info' ? imgMap.get('r' + it.roll.id) : null;
      const w = it.kind === 'info' && infoTypeOf(it.roll) === 'guide' ? GW : CW;
      return { it, img, w, h: heightFor(img, w) };
    });
    const rows = []; let cur = [], curW = 0;
    boxes.forEach(bx => {
      const need = (cur.length ? GAP : 0) + bx.w;
      if (cur.length && curW + need > MAXW) { rows.push(cur); cur = []; curW = 0; }
      curW += (cur.length ? GAP : 0) + bx.w; cur.push(bx);
    });
    if (cur.length) rows.push(cur);
    rows.forEach(row => {
      const rowH = Math.max(...row.map(b => b.h));
      let x = PAD;
      row.forEach(({ it, img, w, h }) => {
        if (draw) {
          const faded = (it.kind === 'info' && it.gone) || (it.kind === 'release' && it.used);
          drawCard(ctx, x, y, w, h, { img, kind: it.kind, type: it.kind === 'info' ? infoTypeOf(it.roll) : '', name: it.roll && it.roll.cardName, faded, used: it.used });
          const label = it.kind === 'info' ? it.roll.cardName + (it.roll.orientation ? ' ' + it.roll.orientation : '') + (it.gone ? '（已放下）' : '')
            : it.kind === 'noble' ? '貴人' : (it.used ? '放下（已執行）' : '放下');
          labelUnder(ctx, label, x, y + h + 10, w);
        }
        x += w + GAP;
      });
      y += rowH + LABEL_H;
    });
    return y + PAD - 40;
  };

  const makePage = render => {
    const H = Math.ceil(render(document.createElement('canvas').getContext('2d'), false));
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#FDFCF9'); bg.addColorStop(1, '#F5EFE4');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    render(ctx, true);
    return canvas;
  };

  const safe = s => s.replace(/[\\/:*?"<>|\s]/g, '');
  const pages = [{ title: '身心靈藍圖', canvas: makePage(renderBlueprintPage), file: safe(`答案_${pName}_${date}_1藍圖.png`) }];
  sections.forEach((sec, i) => pages.push({ title: PHASE_NAMES[sec.ph] + '關的牌', canvas: makePage(renderPhasePage(sec)), file: safe(`答案_${pName}_${date}_${i + 2}${PHASE_NAMES[sec.ph]}關.png`) }));

  try { pages.forEach(p => { p.url = p.canvas.toDataURL('image/png'); }); }
  catch (e) { showToast('圖片產生失敗'); return; }
  showImagePreview(pages, imgTotal && imgFailed ? `有 ${imgFailed}/${imgTotal} 張牌面圖片讀不到，已改用色塊顯示` : '');
}

  const name = (typeof ONLINE !== 'undefined' && ONLINE && ONLINE.roomData && ONLINE.roomData.name) || window._sessionName || '';

  m.id = 'imgExport';
  m.style.cssText = 'position:fixed;inset:0;z-index:10002;background:rgba(44,34,24,0.92);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 calc(env(safe-area-inset-bottom,0px) + 14px);gap:10px;';
  const canShare = !!(navigator.canShare && window.File);
  m.innerHTML = `
    <div style="display:flex;width:100%;max-width:560px;padding:0 14px;box-sizing:border-box;align-items:center;justify-content:space-between;color:#E8DCC8;font-size:13px;">
      <span id="imgPageLabel">1/${pages.length}　${pages[0].title}</span>
      <button id="imgZoomBtn" style="padding:6px 12px;border:1px solid rgba(255,255,255,.3);border-radius:14px;background:transparent;color:#fff;font-size:12px;cursor:pointer;">放大檢視</button>
    </div>
    <div id="imgTrack" style="flex:1;min-height:0;width:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;">
      ${pages.map((p, i) => `<div class="img-slide" style="flex:0 0 100%;scroll-snap-align:center;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;padding:0 14px;box-sizing:border-box;">
        <img data-i="${i}" src="${p.url}" alt="${p.title}" style="width:100%;max-width:532px;height:auto;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.35);">
      </div>`).join('')}
    </div>
    <div id="imgDots" style="display:flex;gap:6px;">${pages.map((_, i) => `<span style="width:7px;height:7px;border-radius:50%;background:${i ? 'rgba(255,255,255,.3)' : '#fff'};"></span>`).join('')}</div>
    ${warn ? `<div style="font-size:12px;color:#F2B8A8;padding:0 14px;">⚠️ ${warn}</div>` : ''}
    <div style="font-size:12px;color:#E8DCC8;">左右滑動換頁，點圖片可放大，長按可存到相簿</div>
    <div style="display:flex;gap:8px;width:100%;max-width:560px;padding:0 14px;box-sizing:border-box;">
      ${canShare ? `<button id="imgShareBtn" style="flex:1;padding:13px;border:none;border-radius:8px;background:linear-gradient(135deg,#A07850,#7C5C38);color:#fff;font-size:14px;cursor:pointer;">分享全部 ${pages.length} 張</button>` : ''}
      <button onclick="document.getElementById('imgExport').remove()" style="flex:1;padding:13px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:transparent;color:#fff;font-size:14px;cursor:pointer;">關閉</button>
    </div>`;
  document.body.appendChild(m);

  const track = document.getElementById('imgTrack');
  const label = document.getElementById('imgPageLabel');
  const dots = [...document.getElementById('imgDots').children];
  const zoomBtn = document.getElementById('imgZoomBtn');
  let cur = 0, zoomed = false;
  const setZoom = on => {
    zoomed = on;
    m.querySelectorAll('.img-slide img').forEach((img, i) => {
      const z = on && i === cur;
      img.style.width = z ? pages[i].canvas.width + 'px' : '100%';
      img.style.maxWidth = z ? 'none' : '532px';
    });
    zoomBtn.textContent = on ? '縮小' : '放大檢視';
  };
  track.addEventListener('scroll', () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== cur && pages[i]) {
      cur = i;
      label.textContent = `${i + 1}/${pages.length}　${pages[i].title}`;
      dots.forEach((d, k) => d.style.background = k === i ? '#fff' : 'rgba(255,255,255,.3)');
      if (zoomed) setZoom(false);
    }
  }, { passive: true });
  m.querySelectorAll('.img-slide img').forEach(img => img.onclick = () => setZoom(!zoomed));
  zoomBtn.onclick = () => setZoom(!zoomed);

  const shareBtn = document.getElementById('imgShareBtn');
  if (shareBtn) shareBtn.onclick = async () => {
    const blobs = await Promise.all(pages.map(p => new Promise(res => p.canvas.toBlob(res, 'image/png'))));
    const files = blobs.map((b, i) => new File([b], pages[i].file, { type: 'image/png' }));
    if (navigator.canShare({ files })) {
      try { await navigator.share({ files }); } catch (e) {}
    } else {
      showToast('這個瀏覽器不支援分享，請長按圖片儲存');
    }
  };
}

}

async function initFirebase() {
  if (_fb) return _fb;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  await loadScript(base + 'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  _fb = { db, auth: firebase.auth() };
  return _fb;
}

function onlineScreen(html) {
  hideFab();
  const ptb = document.getElementById('playerTabsBar'); if (ptb) ptb.innerHTML = '';
  document.getElementById('headerStatus').innerHTML = '';
  document.getElementById('mainContent').innerHTML = `<div class="setup-screen">${html}</div>`;
}

function waitAuth(auth) {
  return new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });
}

// 存到雲端的玩家資料（照片不上傳，避免超過容量）
function playerForCloud(p) {
  const clone = JSON.parse(JSON.stringify(p));
  PHASES.forEach(ph => (clone.phases[ph] || []).forEach(r => { delete r.photo; (r.extras || []).forEach(e => delete e.photo); }));
  return clone;
}

function progressText(p) {
  return PHASES.map(ph => {
    const steps = (p.phases[ph] || []).filter(r => !r.fromCarry && (r.cellType || r.cardName));
    if (p.phaseDone[ph]) return `${PHASE_NAMES[ph]}✓`;
    if (!steps.length) return '';
    return `${PHASE_NAMES[ph]}關第 ${steps.filter(r => !r.isExtra).length} 輪`;
  }).filter(Boolean).join('　') || '尚未開始';
}

function parsePlayerDoc(d) {
  try { const p = JSON.parse(d.json); p.id = d.pid; return p; } catch (e) { return null; }
}

// 每 1.5 秒檢查一次，有變動才上傳
function pushSelfIfChanged() {
  if (!ONLINE || ONLINE.mode !== 'player' || !gameStarted) return;
  const me = players.find(p => p.id === ONLINE.pid); if (!me) return;
  const json = JSON.stringify(playerForCloud(me));
  if (json === _lastPushed) return;
  _lastPushed = json;
  setSyncBadge('busy');
  ONLINE.db.collection('rooms').doc(ONLINE.room).collection('players').doc(ONLINE.uid).set({
    pid: ONLINE.pid, uid: ONLINE.uid, name: me.name || '', topic: me.topic || '', color: me.color || '',
    progress: progressText(me), json,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true }).then(() => {
      setSyncBadge('ok');
      if (ONLINE._syncErr) { ONLINE._syncErr = null; showToast('已恢復同步'); }
    })
    .catch(e => {
      console.warn('sync failed', e);
      _lastPushed = '';      // 下次再試
      setSyncBadge('err', e.code || e.message);
      if (ONLINE._syncErr !== e.code) { ONLINE._syncErr = e.code; showToast('同步失敗：' + (e.code || e.message)); }
    });
}

// 玩家端右上角顯示同步狀態：場次 VZQ7 ✓（已同步）／ ⋯（上傳中）／ ⚠（失敗）
function setSyncBadge(state, msg) {
  if (!ONLINE || ONLINE.mode !== 'player') return;
  const mark = state === 'ok' ? ' ✓' : state === 'err' ? ' ⚠' : ' ⋯';
  setHeaderButton(`場次 ${ONLINE.room}${mark}`, () => showToast(state === 'err' ? '同步失敗：' + msg : state === 'ok' ? '已同步到雲端' : '上傳中…'));
}

function setHeaderButton(label, onclick) {
  const btn = document.querySelector('#mainHeader .header-top button');
  if (btn) { btn.textContent = label; btn.onclick = onclick; }
}

// ── 玩家端 ──
async function startOnlinePlayer(room) {
  onlineScreen('<div class="empty-state">連線中…</div>');
  let fb;
  try { fb = await initFirebase(); } catch (e) { onlineScreen(`<div class="empty-state">無法連線，請確認網路後重新整理</div>`); return; }
  let user = await waitAuth(fb.auth);
  if (!user) { try { user = (await fb.auth.signInAnonymously()).user; } catch (e) { onlineScreen('<div class="empty-state">登入失敗，請重新整理</div>'); return; } }
  const roomRef = fb.db.collection('rooms').doc(room);
  const roomSnap = await roomRef.get().catch(() => null);
  if (!roomSnap || !roomSnap.exists) { onlineScreen(`<div class="setup-title">✦ 找不到場次 ${room}</div><div class="empty-state">請確認代碼是否正確，或向主持人重新取得連結</div>`); return; }
  const roomData = roomSnap.data();
  ONLINE = { mode: 'player', room, uid: user.uid, db: fb.db, auth: fb.auth, roomData };
  window._sessionDate = roomData.date || window._sessionDate;
  setHeaderButton(`場次 ${room}`, () => showToast(`場次代碼 ${room}`));

  const meRef = roomRef.collection('players').doc(user.uid);
  const meSnap = await meRef.get().catch(() => null);
  if (meSnap && meSnap.exists && parsePlayerDoc(meSnap.data())) {
    const me = parsePlayerDoc(meSnap.data());
    ONLINE.pid = me.id;
    beginOnlineGame(me);
  } else {
    renderJoinScreen();
  }
}

function renderJoinScreen() {
  const d = { name: '', zodiac: '', topic: '' };
  window._joinDraft = d;
  const zodiacBtns = Object.entries(ZODIAC_GROUPS).flatMap(([k, vs]) => vs.map(z =>
    `<button class="join-z" data-z="${z}" onclick="pickJoinZodiac('${z}')" style="padding:6px 2px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;">${z}</button>`)).join('');
  onlineScreen(`
    <div>
      <div class="setup-title">✦ 加入${ONLINE.roomData.name ? '「' + ONLINE.roomData.name + '」' : '場次 ' + ONLINE.room}</div>
      <div style="margin-top:6px;font-size:13px;color:var(--text-muted)">${ONLINE.roomData.date || ''}　用你自己的手機記錄這一局</div>
      <div style="margin-top:4px;font-size:11px;color:var(--text-dim)">版本 ${APP_BUILD}</div>
    </div>
    <div class="player-setup-card">
      <div class="field-group"><div class="field-label">你的名字</div>
        <input type="text" placeholder="例：小芳" oninput="_joinDraft.name=this.value"></div>
      <div class="field-group"><div class="field-label">太陽星座（決定起點）</div>
        <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;">${zodiacBtns}</div></div>
      <div class="field-group"><div class="field-label">今次帶入的議題</div>
        <textarea rows="2" placeholder="例：這段感情未來發展？" oninput="_joinDraft.topic=this.value"></textarea></div>
    </div>
    <button class="start-btn" onclick="joinRoom()">加入並開始 →</button>`);
}

function pickJoinZodiac(z) {
  _joinDraft.zodiac = _joinDraft.zodiac === z ? '' : z;
  document.querySelectorAll('.join-z').forEach(b => {
    const on = b.dataset.z === _joinDraft.zodiac;
    b.style.background = on ? 'var(--text)' : 'transparent';
    b.style.color = on ? '#fff' : 'var(--text-muted)';
  });
}

async function joinRoom() {
  const d = _joinDraft;
  if (!d.name.trim()) { showToast('請輸入名字'); return; }
  const col = ONLINE.db.collection('rooms').doc(ONLINE.room).collection('players');
  let maxPid = -1;
  try { (await col.get()).forEach(doc => { const v = doc.data().pid; if (typeof v === 'number') maxPid = Math.max(maxPid, v); }); } catch (e) {}
  const pid = maxPid + 1;
  const me = {
    id: pid, name: d.name.trim(), zodiac: d.zodiac, topic: d.topic.trim(), color: PLAYER_COLORS[pid % PLAYER_COLORS.length],
    phases: { body: [], mind: [], spirit: [] }, nobleCarry: { body: 0, mind: 0, spirit: 0 },
    phaseDone: { body: false, mind: false, spirit: false }, insight: '', action: '',
  };
  ONLINE.pid = pid;
  beginOnlineGame(me);
  _lastPushed = '';          // 強制上傳一次，管理員才看得到新玩家
  pushSelfIfChanged();
}

function beginOnlineGame(me) {
  players = [me];
  currentPlayerId = me.id;
  // 每位玩家的輪次編號分開，避免不同手機的編號撞在一起
  let maxId = me.id * 1000000;
  PHASES.forEach(ph => me.phases[ph].forEach(r => { maxId = Math.max(maxId, r.id || 0); (r.extras||[]).forEach(e => maxId = Math.max(maxId, e.id || 0)); }));
  nextId = maxId + 1;
  _lastPushed = JSON.stringify(playerForCloud(me));
  gameStarted = true;
  applyPlayerSwitch(me.id);
  renderPlayerTabs(); renderPhaseContent(); showFab(); updateHandBar();
  // 同場其他玩家：只用來做「選過的牌不能再選」
  if (_unsubPlayers) _unsubPlayers();
  _unsubPlayers = ONLINE.db.collection('rooms').doc(ONLINE.room).collection('players').onSnapshot(snap => {
    snap.forEach(doc => {
      if (doc.id === ONLINE.uid) return;
      const p = parsePlayerDoc(doc.data()); if (!p) return;
      const i = players.findIndex(x => x.id === p.id);
      if (i >= 0) players[i] = p; else players.push(p);
    });
  });
}

// ── 管理員端 ──
async function startOnlineAdmin() {
  onlineScreen('<div class="empty-state">連線中…</div>');
  let fb;
  try { fb = await initFirebase(); } catch (e) { onlineScreen('<div class="empty-state">無法連線，請確認網路後重新整理</div>'); return; }
  try { await fb.auth.getRedirectResult(); } catch (e) {}
  let user = await waitAuth(fb.auth);
  ONLINE = { mode: 'admin', db: fb.db, auth: fb.auth };
  if (!user || user.isAnonymous || (user.email || '').toLowerCase() !== ADMIN_EMAIL) {
    onlineScreen(`
      <div><div class="setup-title">✦ 管理員登入</div>
      <div style="margin-top:6px;font-size:13px;color:var(--text-muted)">${user && !user.isAnonymous ? `目前登入的 ${user.email} 不是管理員帳號` : '請用管理員的 Google 帳號登入'}</div></div>
      <button class="start-btn" onclick="adminSignIn()">用 Google 登入</button>
      ${user && !user.isAnonymous ? `<button onclick="ONLINE.auth.signOut().then(()=>location.reload())" style="padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-muted);cursor:pointer;">登出</button>` : ''}`);
    return;
  }
  ONLINE.uid = user.uid;
  renderAdminHome();
}

async function adminSignIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await ONLINE.auth.signInWithPopup(provider); location.reload(); }
  catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) ONLINE.auth.signInWithRedirect(provider);
    else showToast('登入失敗：' + (e.code || e.message));
  }
}

async function renderAdminHome() {
  if (_unsubPlayers) { _unsubPlayers(); _unsubPlayers = null; }
  gameStarted = false; ONLINE.viewing = null; ONLINE.room = null;
  setHeaderButton('登出', () => ONLINE.auth.signOut().then(() => location.reload()));
  const today = new Date().toISOString().slice(0, 10);
  onlineScreen(`
    <div><div class="setup-title">✦ 管理員</div>
      <div style="margin-top:6px;font-size:13px;color:var(--text-muted)">${ADMIN_EMAIL}</div></div>
    <div class="player-setup-card">
      <div class="field-group"><div class="field-label">開新場次</div>
        <input type="date" id="newRoomDate" value="${today}" style="font-size:15px;"></div>
      <div class="field-group"><div class="field-label">場次名稱（選填）</div>
        <input type="text" id="newRoomName" placeholder="例：10/3 下午場"></div>
      <button class="start-btn" onclick="createRoom()">建立場次 →</button>
    </div>
    <div class="field-label">最近的場次</div>
    <div id="roomList" style="display:flex;flex-direction:column;gap:8px;"><div class="empty-state">讀取中…</div></div>`);
  try {
    const snap = await ONLINE.db.collection('rooms').orderBy('createdAt', 'desc').limit(30).get();
    const el = document.getElementById('roomList'); if (!el) return;
    if (snap.empty) { el.innerHTML = '<div class="empty-state">還沒有場次</div>'; return; }
    el.innerHTML = snap.docs.map(d => { const r = d.data(); return `
      <button onclick="openAdminRoom('${d.id}')" class="admin-row">
        <span class="admin-code">${d.id}</span><span>${r.name ? r.name + '　' : ''}${r.date || ''}</span><span class="admin-arrow">›</span>
      </button>`; }).join('');
  } catch (e) {
    const el = document.getElementById('roomList'); if (el) el.innerHTML = `<div class="empty-state">讀取失敗：${e.code || e.message}</div>`;
  }
}

async function createRoom() {
  const date = (document.getElementById('newRoomDate') || {}).value || new Date().toISOString().slice(0, 10);
  const name = ((document.getElementById('newRoomName') || {}).value || '').trim();
  const CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (let t = 0; t < 8; t++) {
    const code = Array.from({ length: 4 }, () => CH[Math.floor(Math.random() * CH.length)]).join('');
    const ref = ONLINE.db.collection('rooms').doc(code);
    try {
      const ex = await ref.get();
      if (ex.exists) continue;
      await ref.set({ code, date, name, createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: ADMIN_EMAIL });
      openAdminRoom(code);
      return;
    } catch (e) { showToast('建立失敗：' + (e.code || e.message)); return; }
  }
  showToast('建立失敗，請再試一次');
}

function roomLink(code) { return location.origin + location.pathname + '?room=' + code; }

async function openAdminRoom(code) {
  if (_unsubPlayers) { _unsubPlayers(); _unsubPlayers = null; }
  ONLINE.room = code; ONLINE.viewing = null; gameStarted = false;
  try { const rs = await ONLINE.db.collection('rooms').doc(code).get(); ONLINE.roomData = rs.exists ? rs.data() : {}; } catch (e) { ONLINE.roomData = {}; }
  window._sessionDate = ONLINE.roomData.date || window._sessionDate;
  setHeaderButton('← 場次列表', () => renderAdminHome());
  const link = roomLink(code);
  onlineScreen(`
    <div><div class="setup-title">✦ ${ONLINE.roomData.name ? ONLINE.roomData.name + '　' : ''}場次 ${code}</div>
      <div style="margin-top:4px;font-size:12px;color:var(--text-muted)">${ONLINE.roomData.date || ''}　<button onclick="renameRoom('${code}')" style="border:none;background:none;color:var(--text-muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:0;">${ONLINE.roomData.name ? '改名稱' : '加上名稱'}</button></div>
      <div style="margin-top:4px;font-size:11px;color:var(--text-dim)">版本 ${APP_BUILD}</div></div>
    <div class="player-setup-card" style="align-items:center;text-align:center;">
      <div id="roomQR" style="background:#fff;padding:10px;border-radius:8px;"></div>
      <div style="font-size:12px;color:var(--text-muted);word-break:break-all;">${link}</div>
      <button class="start-btn" onclick="copyRoomLink('${code}')">複製加入連結</button>
    </div>
    <div class="field-label">玩家（即時更新）</div>
    <div id="roomPlayers" style="display:flex;flex-direction:column;gap:8px;"><div class="empty-state">等待玩家加入…</div></div>
    <button onclick="deleteRoom('${code}')" style="margin-top:12px;padding:12px;border:1px solid rgba(160,48,32,.35);border-radius:var(--radius);background:transparent;color:#A03020;font-size:13px;cursor:pointer;">刪除這個場次</button>`);
  try {
    if (!window.QRCode) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
    new QRCode(document.getElementById('roomQR'), { text: link, width: 180, height: 180 });
  } catch (e) {}
  _unsubPlayers = ONLINE.db.collection('rooms').doc(code).collection('players').onSnapshot(snap => {
    const list = snap.docs.map(d => d.data()).sort((a, b) => a.pid - b.pid);
    ONLINE.roomPlayers = list.map(parsePlayerDoc).filter(Boolean);
    if (ONLINE.viewing != null) { refreshAdminView(); return; }
    const el = document.getElementById('roomPlayers'); if (!el) return;
    el.innerHTML = list.length ? list.map(d => `
      <button onclick="adminViewPlayer(${d.pid})" class="admin-row">
        <span class="admin-dot" style="background:${d.color || '#B8A898'}"></span>
        <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;flex:1;">
          <span style="font-weight:600;color:var(--text);">${d.name || '玩家' + (d.pid + 1)}</span>
          <span style="font-size:12px;color:var(--text-muted);text-align:left;">${d.progress || ''}${d.topic ? '　·　' + d.topic : ''}</span>
        </span><span class="admin-arrow">›</span>
      </button>`).join('') : '<div class="empty-state">等待玩家加入…</div>';
  }, err => {
    const el = document.getElementById('roomPlayers');
    if (el) el.innerHTML = `<div class="empty-state">讀取玩家失敗：${err.code || err.message}</div>`;
  });
}

async function renameRoom(code) {
  const cur = (ONLINE.roomData && ONLINE.roomData.name) || '';
  const name = prompt('場次名稱', cur);
  if (name === null) return;
  try {
    await ONLINE.db.collection('rooms').doc(code).set({ name: name.trim() }, { merge: true });
    openAdminRoom(code);
  } catch (e) { showToast('改名失敗：' + (e.code || e.message)); }
}

// 刪除場次：先刪所有玩家紀錄，再刪場次本身（刪除後無法復原）
async function deleteRoom(code) {
  const n = (ONLINE.roomPlayers || []).length;
  const msg = `確定要刪除場次 ${code}？` + (n ? `\n裡面 ${n} 位玩家的紀錄會一起刪除，無法復原。` : '\n刪除後無法復原。');
  if (!confirm(msg)) return;
  if (_unsubPlayers) { _unsubPlayers(); _unsubPlayers = null; }
  try {
    const roomRef = ONLINE.db.collection('rooms').doc(code);
    const snap = await roomRef.collection('players').get();
    const batch = ONLINE.db.batch();
    snap.forEach(d => batch.delete(d.ref));
    batch.delete(roomRef);
    await batch.commit();
    showToast(`已刪除場次 ${code}`);
    renderAdminHome();
  } catch (e) {
    showToast('刪除失敗：' + (e.code || e.message));
  }
}

function copyRoomLink(code) {
  const link = roomLink(code);
  const done = () => showToast('已複製加入連結');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(() => fallbackCopy(link, done));
  else fallbackCopy(link, done);
}

// 管理員檢視玩家：用一般畫面顯示，上方分頁可切換玩家；檢視用，不會寫回玩家的紀錄
function adminViewPlayer(pid) {
  ONLINE.viewing = pid;
  players = (ONLINE.roomPlayers || []).map(p => JSON.parse(JSON.stringify(p)));
  if (!players.some(p => p.id === pid)) return;
  gameStarted = true;
  applyPlayerSwitch(pid);
  setHeaderButton('← 玩家列表', () => openAdminRoom(ONLINE.room));
  renderPlayerTabs(); renderPhaseContent(); hideFab(); updateHandBar();
}

function refreshAdminView() {
  const keep = currentPlayerId, keepPhase = currentPhase;
  players = (ONLINE.roomPlayers || []).map(p => JSON.parse(JSON.stringify(p)));
  if (!players.some(p => p.id === keep)) return;
  currentPlayerId = keep; currentPhase = keepPhase;
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // 正在操作時不打斷
  renderPlayerTabs(); renderPhaseContent(); updateHandBar();
}

// ── 啟動 ──
function startOnlineIfNeeded() {
  const p = onlineParams();
  if (!p) return false;
  if (p.mode === 'player') startOnlinePlayer(p.room);
  else startOnlineAdmin();
  return true;
}
setInterval(pushSelfIfChanged, 1500);
</script>
</body>
</html>
